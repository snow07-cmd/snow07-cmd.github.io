# 요트핏 날씨 자동 업데이트
# 날씨를 받은 뒤 30분 기다렸다가, 다음 실행을 스스로 시작해요 (줄줄이 이어서 실행).
# 예약(cron)은 줄이 끊겼을 때 다시 잇는 예비용이에요.
# 인증키: 저장소 Settings → Secrets and variables → Actions → KMA_KEY
name: 날씨 업데이트

on:
  schedule:
    - cron: "7,37 * * * *"   # 예비용. 저장소 주인 계정으로 저장해야 자동 실행돼요
  workflow_dispatch:

permissions:
  contents: write
  actions: write            # 다음 실행을 스스로 시작하려면 필요해요

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 기상청 날씨 받기
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: node scripts/fetch-weather.mjs

      - name: 바뀐 내용 저장
        run: |
          if [ -f weather.json ] && [ -n "$(git status --porcelain weather.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add weather.json
            git commit -m "날씨 자동 업데이트"
            git pull --rebase -q
            git push
          else
            echo "바뀐 내용이 없어요."
          fi

      - name: 30분 뒤 다음 실행 시작
        if: always()              # 날씨 받기가 실패해도 줄은 이어가요
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1740
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" -w weather.yml --json status \
                    -q '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting")] | length')
          if [ "$waiting" = "0" ]; then
            gh workflow run weather.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "다음 실행을 시작했어요."
          else
            echo "이미 기다리는 실행이 있어서 새로 시작하지 않아요."
          fi
