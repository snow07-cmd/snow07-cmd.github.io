# 요트핏 날씨 자동 업데이트
# 1시간마다 기상청 API를 불러 weather.json을 새로 저장합니다.
# 인증키: 저장소 Settings → Secrets and variables → Actions → KMA_KEY
name: 날씨 업데이트

on:
  schedule:
    - cron: "17 * * * *"     # 매시 17분 (UTC 기준, 한국 시각도 매시 17분)
  workflow_dispatch:          # Actions 화면에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 기상청 날씨 받기
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
        run: node scripts/fetch-weather.mjs

      - name: 바뀐 내용 저장
        run: |
          if [ -f weather.json ] && [ -n "$(git status --porcelain weather.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add weather.json
            git commit -m "날씨 자동 업데이트"
            git push
          else
            echo "바뀐 내용이 없어요."
          fi
