  <meta name="description" content="강릉 마리나의 체험, 가는 방법, 주변 관광, 안전 수칙을 한곳에서 확인하고 AI로 방문 코스를 추천받으세요.">

  <style>
/* =====================================================================
   요트핏 디자인 (v5, 안내 사이트형 / 회청색)
   색을 바꾸고 싶으면 맨 위 :root 의 색 코드만 바꾸면 전체가 바뀝니다.
   ===================================================================== */
:root {
  --bg: #F4F6F7;          /* 페이지 바탕 */
  --paper: #FFFFFF;       /* 판(패널) 바탕 */
  --ink: #1C2830;         /* 본문 글자 */
  --sub: #5D6B74;         /* 보조 글자 */
  --faint: #8A979E;       /* 흐린 글자 (빈 값) */
  --line: #DDE3E7;        /* 구분선 */
  --soft: #EBF0F2;        /* 연한 바탕 (칩, 표 머리) */
  --primary: #2C5A6E;     /* 대표색 (버튼, 링크) */
  --primary-dark: #22495A;
  --cover: #2C4653;       /* 표지 바탕 */
  --cover-sub: #B7C7CF;   /* 표지 보조 글자 */
  --tile: #3A5866;        /* 표지 바로가기 칸 */
  --good: #4E9A73;  --mild: #D9B44A;  --rough: #D98447;  --stop: #C25450;  /* 오늘 바다 4단계 */
  --r: 8px;               /* 판 모서리 */
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  font-family: "Noto Sans KR", system-ui, sans-serif;
  background: var(--bg); color: var(--ink);
  line-height: 1.6; word-break: keep-all;
  min-height: 100vh; display: flex; flex-direction: column;
}
main { flex: 1; }
a { color: inherit; text-decoration: none; }
button, textarea, input { font-family: inherit; }
.icon { flex-shrink: 0; vertical-align: middle; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.container { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 28px; }
.container.narrow { max-width: 760px; }

/* ---------- 상단 ---------- */
#site-header { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--primary); color: #fff; display: grid; place-items: center; }
.logo-text { display: flex; align-items: baseline; gap: 8px; font-size: 20px; font-weight: 900; letter-spacing: -.03em; }
.logo-text small { font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--sub); }
.nav { display: flex; align-items: center; gap: 2px; }
.nav a { padding: 8px 11px; font-size: 15px; color: var(--ink); border-radius: 6px; }
.nav a:hover { background: var(--soft); }
.nav a.current { font-weight: 700; box-shadow: inset 0 -2px 0 var(--primary); border-radius: 0; }
.nav a.nav-ai { margin-left: 8px; border: 1.5px solid var(--primary); color: var(--primary); font-weight: 700; padding: 7px 14px; border-radius: 6px; box-shadow: none; }
.nav a.nav-ai:hover, .nav a.nav-ai.current { background: var(--primary); color: #fff; }
.menu-btn { display: none; background: none; border: 0; width: 40px; height: 40px; cursor: pointer; }
.menu-btn span { display: block; width: 22px; height: 2px; background: var(--ink); margin: 5px auto; border-radius: 2px; }

/* ---------- 하단 ---------- */
#site-footer { background: var(--paper); border-top: 1px solid var(--line); margin-top: 64px; }
.footer-inner { padding: 24px 28px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--sub); }
.footer-inner strong { color: var(--ink); }

/* ---------- 메인: 표지 ---------- */
.cover { background: var(--cover); color: #fff; }
.cover-inner { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: start; }
.cover .cover-inner { padding-top: 44px; padding-bottom: 44px; }
.addr { font-size: 15px; color: var(--cover-sub); }
.cover h1 { font-size: 44px; font-weight: 900; letter-spacing: -.04em; line-height: 1.22; margin: 6px 0 24px; white-space: pre-line; }
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 560px; }
.quick a {
  background: var(--tile); color: #F1F5F7; border-radius: var(--r);
  padding: 14px 4px 11px; display: flex; flex-direction: column; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 700; text-align: center;
}
.quick a:hover { background: #45667A; }

/* 오늘 바다 판 */
.sea { background: var(--paper); color: var(--ink); border-radius: 10px; padding: 22px 24px; }
.sea-head { display: flex; justify-content: space-between; align-items: baseline; }
.sea-head b { font-size: 16px; }
.sea-head span { font-size: 13px; color: var(--sub); }
.sea-status { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 900; letter-spacing: -.03em; margin: 8px 0 12px; }
.sea-status i { width: 16px; height: 16px; border-radius: 50%; background: #C4CCD2; }
.sea-status.st-good i { background: var(--good); } .sea-status.st-mild i { background: var(--mild); }
.sea-status.st-rough i { background: var(--rough); } .sea-status.st-stop i { background: var(--stop); }
.lv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-bottom: 14px; }
.lv span { font-size: 12px; text-align: center; padding: 5px 2px 0; border-top: 4px solid; color: var(--sub); }
.lv .good { border-color: var(--good); } .lv .mild { border-color: var(--mild); }
.lv .rough { border-color: var(--rough); } .lv .stop { border-color: var(--stop); }
.lv span.on { color: var(--ink); font-weight: 700; }
.vals { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.vals div { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.vals div:nth-child(odd) { padding-right: 14px; }
.vals div:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--line); }
.vals span { color: var(--sub); }
.vals b.empty { color: var(--faint); }
.sea-link { display: inline-block; margin-top: 14px; font-weight: 700; color: var(--primary); font-size: 15px; border-bottom: 1px solid currentColor; }

/* 한눈에 보는 마리나 */
.facts { background: var(--paper); border-bottom: 1px solid var(--line); }
.facts-inner { display: grid; grid-template-columns: repeat(4, 1fr); }
.fact { padding: 20px 20px 20px 0; display: flex; gap: 12px; min-width: 0; }
.fact + .fact { padding-left: 20px; border-left: 1px solid var(--line); }
.fact .icon { color: var(--primary); margin-top: 2px; }
.fact small { display: block; font-size: 13px; color: var(--sub); }
.fact b { display: block; font-size: 15px; }
.fact p { font-size: 13px; color: var(--sub); overflow-wrap: anywhere; }

/* 코스 입력 줄 (메인) */
.course-bar {
  margin-top: 36px; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center;
  background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--primary);
  border-radius: var(--r); padding: 18px 22px;
}
.course-bar label { font-size: 17px; font-weight: 700; white-space: nowrap; }
.course-bar input {
  border: 0; border-bottom: 1.5px solid var(--line); font-size: 16px; padding: 8px 2px;
  color: var(--ink); width: 100%; background: transparent; min-width: 0;
}
.course-bar input:focus { outline: none; border-bottom-color: var(--primary); }

/* 메인: 가는 방법 요약 + 타기 전에 꼭 */
.two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; margin-top: 40px; }
.two > * { min-width: 0; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.panel-head h2 { font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
.panel-head a { font-size: 14px; color: var(--primary); font-weight: 700; white-space: nowrap; }
.tbl { overflow-x: auto; }
.sum-table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 15px; }
.sum-table th { text-align: left; font-size: 13px; font-weight: 500; color: var(--sub); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.sum-table td { padding: 11px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tnote { font-size: 13px; color: var(--sub); margin-top: 10px; }
.check { list-style: none; }
.check li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.check li:last-child { border-bottom: 0; }
.check .icon { color: var(--primary); margin-top: 4px; }

/* 메인: 주변 관광 */
.near { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.near a { padding: 18px 20px; }
.near a + a { border-left: 1px solid var(--line); }
.near a:hover h3 { text-decoration: underline; }
.near h3 { font-size: 16px; }
.near p { font-size: 14px; color: var(--sub); }
.near small { display: block; margin-top: 8px; font-size: 13px; color: var(--sub); }

/* ---------- 공통: 하위 페이지 제목 ---------- */
.page-head { background: var(--paper); border-bottom: 1px solid var(--line); padding: 40px 0 32px; }
.page-head h1 { font-size: 32px; font-weight: 900; letter-spacing: -.03em; margin-bottom: 4px; }
.page-head p { color: var(--sub); }

/* ---------- 공통: 섹션 ---------- */
.section { padding: 48px 0; }
.pt-0 { padding-top: 0; }
.block { margin-top: 40px; }
.section-title { font-size: 22px; font-weight: 900; letter-spacing: -.03em; margin-bottom: 12px; }
.section-title.sm { font-size: 19px; }
.section-desc { color: var(--sub); margin: -6px 0 16px; }

/* ---------- 공통: 칩 ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-row.small { gap: 6px; }
.chip {
  display: inline-flex; align-items: center; background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 13px; font-size: 14px; cursor: pointer;
}
.chip-lg { padding: 9px 15px; font-size: 15px; }
a.chip:hover, button.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip-row.small .chip { padding: 4px 10px; font-size: 13px; cursor: default; background: var(--soft); border-color: transparent; }
.chip-empty { border-style: dashed !important; color: var(--faint) !important; background: var(--paper) !important; border-color: #C3CDD3 !important; }

/* ---------- 공통: 판·격자 ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; }
.card h3 { font-size: 18px; font-weight: 700; }
.card p { color: var(--sub); }
.card-label { font-size: 14px !important; font-weight: 700; color: var(--sub); }
.muted { color: var(--sub); }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.info-list { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--sub); }
.info-list li { display: flex; align-items: center; gap: 6px; }
.notice-line { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 6px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; color: var(--sub); }
.alert-line { display: flex; gap: 10px; align-items: center; border-left-color: var(--rough); }
.alert-on { border-left-color: var(--stop); color: var(--ink); background: #FBEFEE; }
.alert-off { border-left-color: var(--good); }
.alert-off .icon { color: var(--good); }
.credit[hidden] { display: none; }

/* 준비 중 */
.preparing { background: var(--paper); border: 1px dashed #C3CDD3; border-radius: var(--r); padding: 40px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.preparing-icon { color: var(--faint); margin-bottom: 6px; }
.preparing strong { font-size: 17px; }
.preparing p { color: var(--sub); font-size: 15px; }
.placeholder-text { color: var(--faint) !important; font-size: 14px; }

/* ---------- 공통: 버튼 ---------- */
.btn-orange {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--primary); color: #fff; border: 0; border-radius: 6px;
  padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.btn-orange:hover { background: var(--primary-dark); }
.btn-orange.sm { padding: 8px 14px; font-size: 14px; }
.btn-line { display: inline-flex; align-items: center; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--primary); background: var(--paper); }
.btn-line:hover { border-color: var(--primary); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; }

/* ---------- 요트·체험 ---------- */
.company { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.company + .company { margin-top: 10px; }
.company[open] { border-color: var(--primary); }
.company-sum { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto auto; gap: 20px; align-items: center; padding: 18px 24px; }
.company-sum::-webkit-details-marker { display: none; }
.company-sum:hover { background: var(--bg); }
.company-sum:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.company[open] > .company-sum { border-bottom: 1px solid var(--line); }
.cs-main h3 { font-size: 20px; font-weight: 900; letter-spacing: -.03em; }
.cs-meta { font-size: 14px; color: var(--sub); margin-top: 2px; }
.cs-price { display: grid; gap: 2px; text-align: right; font-size: 14px; color: var(--sub); }
.cs-price b { color: var(--ink); font-size: 16px; font-weight: 900; margin-left: 6px; }
.cs-toggle { font-size: 14px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.cs-toggle::before { content: "자세히 보기"; }
.company[open] .cs-toggle::before { content: "접기"; }
.cs-toggle::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
.company[open] .cs-toggle::after { transform: translateY(2px) rotate(-135deg); }
.company-body { padding: 18px 24px 22px; }
.company-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.company-head .btn-row { margin-left: auto; }
.company-head h3 { font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
.aka { font-size: 14px; color: var(--sub); }
.company-head .btn-row { margin-top: 0; padding-top: 0; }
.company-info { margin: 0 0 18px; padding: 0 0 14px; border-bottom: 1px solid var(--line); gap: 6px; }
.company-head + .company-info { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.company-info li { align-items: flex-start; }
.company-info .icon { margin-top: 3px; }
.company-info b { color: var(--ink); margin-right: 4px; }
.course-group + .course-group { margin-top: 18px; }
.company-hint { font-size: 14px; margin-bottom: 10px; }
.cg-title { font-size: 15px; font-weight: 900; margin-bottom: 6px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cg-title span { font-size: 13px; font-weight: 400; color: var(--sub); }
.course-list { border-top: 2px solid var(--ink); }
.course-row { display: grid; grid-template-columns: 1fr 120px 130px; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.course-row h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cr-badge { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--soft); border-radius: 4px; padding: 1px 6px; }
.cr-dur { font-size: 14px; color: var(--sub); display: flex; align-items: center; gap: 5px; }
.course-row .exp-price { font-size: 16px; text-align: right; }
.course-row .exp-note { font-size: 13px; color: var(--sub) !important; margin-top: 2px; }
.schedule { background: var(--bg); border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; font-size: 14px; }
.sch-head { margin-bottom: 6px; color: var(--sub); }
.sch-head b { color: var(--ink); margin-right: 6px; }
.sch-times { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.sch-times li { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 13px; }
.schedule details { margin-top: 10px; }
.schedule summary { cursor: pointer; color: var(--primary); font-weight: 700; font-size: 13px; }
.sch-row { display: grid; grid-template-columns: 80px 1fr; gap: 8px; margin-top: 8px; align-items: start; }
.sch-row > span { font-weight: 700; font-size: 13px; padding-top: 3px; }
.exp-card .chip-row { margin-top: 4px; }
.exp-price { font-size: 20px; font-weight: 900; color: var(--ink) !important; letter-spacing: -.02em; }
.exp-note { font-size: 14px; color: var(--primary) !important; }
.exp-info { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); gap: 6px; }
.exp-info li { align-items: flex-start; }
.exp-info .icon { margin-top: 3px; }
.exp-info b { color: var(--ink); font-weight: 700; margin-right: 4px; }
.facility-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.fee-tag { flex-shrink: 0; font-size: 12px; font-weight: 700; background: var(--soft); color: var(--primary); border-radius: 4px; padding: 2px 8px; margin-top: 3px; }
.facility-card .info-list { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
.soon-card h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.soon-card .icon { color: var(--primary); }
.tag-soon { font-size: 12px; font-weight: 700; color: var(--sub); background: var(--soft); border-radius: 4px; padding: 2px 8px; }

/* ---------- 가는 방법 ---------- */
.transport-card { gap: 10px; }
.mode-title { display: flex; align-items: center; gap: 6px; font-weight: 700; margin-top: 6px; }
.mode-title .muted { font-weight: 400; font-size: 14px; }
.bus-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.bus-table th { text-align: left; font-size: 12px; font-weight: 500; color: var(--sub); padding: 4px 6px; border-bottom: 1px solid var(--line); }
.bus-table td { padding: 7px 6px; border-bottom: 1px solid var(--soft); }
.bus-no { display: inline-block; min-width: 48px; text-align: center; background: var(--primary); color: #fff; font-weight: 700; border-radius: 4px; padding: 1px 7px; font-size: 13px; }
.mode-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: var(--bg); border-radius: 6px; font-size: 14px; }
.mode-row .muted { margin-left: auto; }

/* ---------- 주변 관광 ---------- */
.move-info { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--sub); }
.move-info b { color: var(--primary); margin-left: auto; }

/* ---------- 안전 가이드 ---------- */

/* ---------- 안전 가이드 (단계 + 표지판) ---------- */
.sg-steps { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); overflow: hidden; }
.sg-step { display: flex; gap: 10px; align-items: center; padding: 14px 16px; text-align: left; font: inherit; color: var(--sub); background: none; border: 0; border-right: 1px solid var(--line); cursor: pointer; }
.sg-step:last-child { border-right: 0; }
.sg-step:hover { background: var(--bg); }
.sg-step:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.sg-step[aria-pressed="true"] { background: var(--primary); color: #fff; }
.sg-step em { flex: 0 0 auto; font-style: normal; width: 28px; height: 28px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font-size: 14px; font-weight: 900; }
.sg-step b { display: block; font-size: 16px; }
.sg-step small { display: block; font-size: 12px; opacity: .8; }
.sg-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: var(--sub); margin: 20px 0 16px; }
.sg-legend span { display: flex; align-items: center; gap: 8px; }
.sg-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; scroll-margin-top: 90px; }
.sg-tile { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; }
.sg-tile.no { border-color: #EBC9C7; }
.sg-kind { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.sg-kind.must { color: var(--primary); } .sg-kind.no { color: var(--stop); } .sg-kind.info { color: var(--sub); }
.sg-tile h3 { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.sg-tile p.t { font-size: 14px; color: var(--sub); margin-top: 4px; }
.sign { flex: 0 0 auto; width: 56px; height: 56px; display: grid; place-items: center; position: relative; }
.sign svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sign.must { background: var(--primary); color: #fff; border-radius: 50%; }
.sign.no { background: #fff; color: var(--ink); border: 3px solid var(--stop); border-radius: 50%; overflow: hidden; }
.sign.no::after { content: ""; position: absolute; left: calc(50% - 1.5px); top: -3px; bottom: -3px; width: 3px; background: var(--stop); transform: rotate(45deg); }
.sign.info { background: var(--soft); color: var(--primary); border-radius: 6px; }
.sg-legend .sign { width: 28px; height: 28px; }
.sg-legend .sign svg { width: 16px; height: 16px; }
.sg-legend .sign.no { border-width: 2px; }
.sg-legend .sign.no::after { width: 2px; left: calc(50% - 1px); }
@media (max-width: 900px) { .sg-tiles { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) {
  .sg-steps { grid-template-columns: 1fr 1fr; }
  .sg-step { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .sg-step:nth-child(2n) { border-right: 0; }
  .sg-step:nth-child(n+3) { border-bottom: 0; }
  .sg-step b { font-size: 15px; }
  .sg-tiles { grid-template-columns: 1fr; }
  .sg-tile { padding: 14px; grid-template-columns: 48px 1fr; }
  .sg-tile .sign { width: 48px; height: 48px; }
  .sg-tile .sign svg { width: 26px; height: 26px; }
}
.check-list { padding-left: 20px; color: var(--ink); display: flex; flex-direction: column; gap: 4px; }

/* ---------- 코스 결과 ---------- */
.result-grid { display: grid; grid-template-columns: 330px 1fr; gap: 24px; align-items: start; }
.result-side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 84px; }
.quote { font-size: 16px; color: var(--ink) !important; background: var(--bg); border-radius: 6px; padding: 12px 14px; }
.text-link { font-size: 14px; font-weight: 700; color: var(--primary); }
.note { font-size: 13px; margin-top: 6px; }
.result-main { display: flex; flex-direction: column; gap: 12px; }
.course-title { font-size: 26px; font-weight: 900; letter-spacing: -.03em; }
.mb-16 { margin-bottom: 4px; }
.step-card { flex-direction: row; gap: 16px; align-items: flex-start; }
.step-card.best { border-color: var(--primary); box-shadow: inset 4px 0 0 var(--primary); }
.step-num { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); color: var(--primary); display: grid; place-items: center; font-weight: 900; flex-shrink: 0; }
.step-card.best .step-num { background: var(--primary); color: #fff; }
.step-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.step-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { background: var(--soft); color: var(--primary); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
.navy-box { background: var(--cover); color: #fff; border-radius: var(--r); padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; }
.navy-links { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.navy-links a { color: #fff; font-weight: 700; border-bottom: 1px solid var(--cover-sub); }
.disclaimer { font-size: 13px; color: var(--sub); }

/* ---------- 코스 짜기 (입력 페이지) ---------- */
.ai-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.ai-card-title { font-size: 17px; font-weight: 700; }
.ai-card textarea { width: 100%; resize: vertical; min-height: 110px; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; font-size: 16px; line-height: 1.6; background: var(--bg); color: var(--ink); }
.ai-card textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; background: var(--paper); }
.ai-card .btn-orange { align-self: flex-end; }
.examples { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.example { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; font-size: 15px; color: var(--sub); cursor: pointer; }
.example:hover { border-color: var(--primary); color: var(--ink); }

/* ---------- 실시간 정보 ---------- */
.live-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; align-items: start; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.cam-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.cam-tab { font-size: 13px; cursor: pointer; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.cam-tab.on { background: var(--primary); border-color: var(--primary); color: #fff; }
.cctv { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #24394A; color: #9FB4C0; }
.cctv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cctv-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
.cctv-tl { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
.cctv-tag { background: rgba(255,255,255,.12); color: #fff; font-size: 12px; border-radius: 4px; padding: 2px 8px; }
.cctv-br { position: absolute; bottom: 12px; right: 12px; font-size: 12px; color: #7F97A4; }
.live-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #fff; background: rgba(255,255,255,.12); border-radius: 4px; padding: 2px 8px; }
.live-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.updated { font-size: 12px; color: var(--sub); }
.wx-list { display: flex; flex-direction: column; }
.wx-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.wx-row span { color: var(--sub); display: flex; gap: 8px; align-items: center; }
.wx-row b { font-size: 16px; color: var(--ink); }
.wx-row b.empty { color: var(--faint); }
.wx-val { display: flex; align-items: center; gap: 8px; }
.easy { font-style: normal; font-size: 12px; background: var(--soft); color: var(--primary); border-radius: 4px; padding: 1px 7px; }
.sunset-box { background: var(--cover); color: #fff; border-radius: 6px; padding: 12px 16px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
.sunset-box span { display: flex; gap: 8px; align-items: center; }
.sunset-box b { font-size: 19px; }
.disc { font-size: 12px !important; color: var(--sub); margin-top: 6px; }

/* 오늘 상태 배지 */
.title-badge { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.day-badge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 12px; font-weight: 700; border-radius: 4px; padding: 2px 8px; background: var(--soft); color: var(--ink); }
.day-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.day-good::before  { background: var(--good); }
.day-mild::before  { background: var(--mild); }
.day-rough::before { background: var(--rough); }
.day-stop::before  { background: var(--stop); }
.day-none { color: var(--sub); }

/* 휴대폰 표지: 오늘 바다 한 줄 요약 (PC에서는 숨김) */
.live-summary { display: none; background: var(--paper); color: var(--ink); border-radius: var(--r); padding: 14px 16px; flex-direction: column; gap: 6px; }
.ls-top { display: flex; align-items: center; gap: 8px; }
.ls-top > b { font-size: 15px; }
.ls-more { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--primary); white-space: nowrap; }
.ls-line { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13px; color: var(--sub); }
.ls-line b { color: var(--ink); }
.ls-line em { font-style: normal; color: var(--primary); }

/* 이번 주 날씨 */
.week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.week-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.week-card.today { border-color: var(--primary); box-shadow: inset 0 3px 0 var(--primary); }
.wk-day { display: flex; align-items: baseline; gap: 6px; }
.wk-day span { font-size: 12px; color: var(--sub); }
.wk-sky, .wk-temp { font-size: 14px; color: var(--sub); }
.wk-temp b { font-size: 17px; color: var(--ink); }
.wk-info { list-style: none; font-size: 13px; color: var(--sub); display: flex; flex-direction: column; gap: 2px; }
.wk-info li { display: flex; align-items: center; gap: 5px; }

/* 한 달 날씨 (달력) */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.cal-head { text-align: center; font-size: 12px; font-weight: 700; color: var(--sub); padding: 4px 0; }
.cal-head.sun, .cal-date.sun { color: #B5483F; }
.cal-head.sat, .cal-date.sat { color: #2F6492; }
.cal-cell { min-height: 72px; border-radius: 6px; background: var(--bg); padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
.cal-cell.blank { background: transparent; }
.cal-cell.today { box-shadow: inset 0 0 0 2px var(--primary); }
.cal-date { font-weight: 700; font-size: 13px; color: var(--ink); }
.cal-st { color: var(--faint); }
.cal-sky { color: var(--sub); }
.cal-temp { color: var(--faint); }
.cal-cell.st-good .cal-st { color: #2F7A55; } .cal-cell.st-mild .cal-st { color: #8E6B00; }
.cal-cell.st-rough .cal-st { color: #A2541E; } .cal-cell.st-stop .cal-st { color: #A43A36; }

/* 쉬운 말 기준표 */
.legend ul { list-style: none; }
.legend-days { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.legend-days li { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 14px; color: var(--sub); }
.legend-scale { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.legend-scale:last-child { border-bottom: 0; }
.legend-scale > span { font-weight: 700; color: var(--ink); }
.legend-scale ul { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--sub); }
.legend-scale b { color: var(--primary); margin-right: 2px; }

/* 여백 도우미 */
.mt-24 { margin-top: 24px; } .mt-32 { margin-top: 32px; } .mt-48 { margin-top: 48px; }
.center { text-align: center; }

/* =====================================================================
   반응형
   ===================================================================== */
@media (max-width: 1080px) {
  .nav a { padding: 8px 8px; font-size: 14px; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 900px) {
  .menu-btn { display: block; }
  .nav { display: none; position: absolute; top: 64px; left: 0; right: 0; background: var(--paper); border-bottom: 1px solid var(--line); flex-direction: column; align-items: stretch; padding: 10px 24px 18px; gap: 0; }
  .nav.open { display: flex; }
  .nav a { padding: 12px 6px; font-size: 16px; border-bottom: 1px solid var(--soft); }
  .nav a.current { box-shadow: none; color: var(--primary); }
  .nav a.nav-ai { margin: 10px 0 0; text-align: center; }
  .cover-inner { grid-template-columns: 1fr; gap: 24px; }
  .cover .cover-inner { padding-top: 32px; padding-bottom: 32px; }
  .cover h1 { font-size: 34px; }
  .facts-inner { grid-template-columns: 1fr 1fr; }
  .fact:nth-child(3) { padding-left: 0; border-left: 0; }
  .fact:nth-child(n+3) { border-top: 1px solid var(--line); }
  .course-bar { grid-template-columns: 1fr; }
  .two { grid-template-columns: 1fr; }
  .near { grid-template-columns: 1fr 1fr; }
  .near a:nth-child(3) { border-left: 0; }
  .near a:nth-child(n+3) { border-top: 1px solid var(--line); }
  .grid-3 { grid-template-columns: 1fr; }
  .live-grid, .result-grid { grid-template-columns: 1fr; }
  .result-side { position: static; }
  .week-row { grid-template-columns: repeat(7, 128px); overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
  .week-card { scroll-snap-align: start; }
}
@media (max-width: 600px) {
  .container { padding: 0 16px; }
  .footer-inner { padding: 20px 16px; }
  .cover h1 { font-size: 28px; margin-bottom: 18px; }
  .quick { gap: 6px; }
  .quick a { font-size: 11px; padding: 10px 2px 8px; }
  /* 휴대폰 표지: 오늘 바다 판 대신 한 줄 요약 */
  .cover .sea { display: none; }
  .live-summary { display: flex; }
  .facts-inner { grid-template-columns: 1fr; }
  .fact, .fact + .fact { padding: 14px 0; border-left: 0; }
  .fact + .fact { border-top: 1px solid var(--line); }
  .grid-2, .grid-4 { grid-template-columns: 1fr; }
  .section { padding: 36px 0; }
  .page-head { padding: 28px 0 22px; }
  .page-head h1 { font-size: 26px; }
  .panel, .card { padding: 18px; }
  .company-sum { grid-template-columns: 1fr auto; grid-template-areas: "main tog" "price price"; gap: 6px 12px; padding: 14px 16px; }
  .cs-main { grid-area: main; }
  .cs-main h3 { font-size: 18px; }
  .cs-meta { font-size: 13px; }
  .cs-price { grid-area: price; display: flex; flex-wrap: wrap; gap: 2px 14px; text-align: left; font-size: 13px; }
  .cs-price b { font-size: 15px; margin-left: 4px; }
  .cs-toggle { grid-area: tog; align-self: start; padding-top: 6px; }
  .cs-toggle::before, .company[open] .cs-toggle::before { content: ""; }
  .company-body { padding: 14px 16px 18px; }
  .course-row { grid-template-columns: 1fr auto; }
  .course-row .cr-main { grid-column: 1 / -1; }
  .course-row .exp-price { text-align: right; }
  .sch-row { grid-template-columns: 1fr; gap: 4px; }
  .company-head h3 { font-size: 20px; }
  .step-card { gap: 12px; }
  .course-title { font-size: 22px; }
  .cal { padding: 8px; gap: 3px; }
  .cal-cell { min-height: 56px; padding: 4px; font-size: 10px; }
  .cal-date { font-size: 12px; }
  .cal-temp { display: none; }
}

/* ---------- 요트 업체 카드 + 코스 승선권 ---------- */
.cc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.cc { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.cc:hover { border-color: var(--primary); }
.cc:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.cc[aria-pressed="true"] { border: 2px solid var(--primary); padding: 17px; }
.cc h3 { font-size: 19px; font-weight: 900; letter-spacing: -.03em; }
.cc .cnt { font-size: 13px; color: var(--sub); margin-top: 2px; }
.cc-feat { display: flex; flex-wrap: wrap; gap: 4px; }
.cc-feat span { font-size: 12px; font-weight: 700; color: var(--primary); background: var(--soft); border-radius: 4px; padding: 2px 7px; }
.cc-price { display: grid; gap: 2px; font-size: 13px; color: var(--sub); border-top: 1px solid var(--line); padding-top: 10px; }
.cc-price b { color: var(--ink); font-size: 15px; font-weight: 900; margin-left: 4px; }
.cc-more { margin-top: auto; font-size: 14px; font-weight: 700; color: var(--primary); }
.cc[aria-pressed="true"] .cc-more { color: var(--ink); }
.cd { margin-top: 16px; background: var(--paper); border: 2px solid var(--primary); border-radius: 10px; padding: 22px 24px; scroll-margin-top: 84px; }
.cd-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.cd-head h3 { font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
.cd-head .btn-row { margin: 0; padding: 0; }
.cd .company-info { margin: 14px 0 0; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cd .schedule { margin-top: 14px; }
.cd .cg-title { margin: 20px 0 8px; }
.tk-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tk { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.tk-top { padding: 14px 16px 12px; }
.tk-type { font-size: 12px; font-weight: 700; color: var(--primary); }
.tk-type.private { color: #7A5A2E; }
.tk-type.special { color: var(--stop); }
.tk h4 { font-size: 16px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; line-height: 1.35; }
.tk-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.tk-badges span { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--soft); border-radius: 4px; padding: 1px 6px; }
.tk-note { font-size: 13px; color: var(--sub); margin-top: 6px; }
.tk-cut { position: relative; border-top: 2px dashed var(--line); margin-top: auto; }
.tk-cut::before, .tk-cut::after { content: ""; position: absolute; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); }
.tk-cut::before { left: -9px; }
.tk-cut::after { right: -9px; }
.tk-bot { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 16px 14px; }
.tk-dur { font-size: 13px; color: var(--sub); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.tk-price { font-size: 18px; font-weight: 900; letter-spacing: -.02em; text-align: right; }
.tk-price small { font-size: 12px; font-weight: 700; color: var(--sub); margin-right: 3px; }
@media (max-width: 900px) { .cc-grid, .tk-row { grid-template-columns: 1fr 1fr; } }
@media (max-width: 640px) {
  .cc-grid { gap: 8px; }
  .cc { padding: 14px; gap: 10px; }
  .cc[aria-pressed="true"] { padding: 13px; }
  .cc h3 { font-size: 17px; }
  .cc-price b { display: block; margin-left: 0; }
  .cc-cap, .cc-more { display: none; }
  .cd { padding: 16px; }
  .tk-row { grid-template-columns: 1fr; }
}

/* =====================================================================
   v15 휴대폰 먼저: 첫 화면(수평선) · 좋은 시간 · 요트 카드 · 안목 코스 · 아래 탭
   ===================================================================== */
body { font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif; }
.hero { position: relative; overflow: hidden; color: #fff; min-height: 560px; }
.hero-sky { position: absolute; inset: 0; background: linear-gradient(180deg, #5B8DA5 0%, #9CC0CE 58%, #CFE0E5 70%); }
.sky-dawn .hero-sky { background: linear-gradient(180deg, #4E6E8E 0%, #A9B9CF 52%, #F2D2B8 70%); }
.sky-sunset .hero-sky { background: linear-gradient(180deg, #4F7D96 0%, #A7BFC6 40%, #EBC7A2 62%, #F0B27F 70%); }
.sky-night .hero-sky { background: linear-gradient(180deg, #0F2330 0%, #1D3A48 55%, #2C4F61 70%); }
.hero-sun { position: absolute; right: 18%; top: 54%; width: 64px; height: 64px; border-radius: 50%; background: #FFF3DC; opacity: .9; }
.sky-sunset .hero-sun { background: #FBD9AE; top: 57%; }
.sky-night .hero-sun { width: 40px; height: 40px; background: #E8EEF2; opacity: .85; top: 22%; box-shadow: inset -10px -4px 0 0 #1D3A48; }
.hero-boat { position: absolute; left: 14%; top: calc(66% - 50px); color: #1D3A48; }
.sky-night .hero-boat { color: #0B1A23; }
.hero-boat .icon { fill: rgba(255, 255, 255, .92); }
.hero-wave { position: absolute; left: 0; width: 100%; top: calc(66% - 20px); height: 60px; fill: #3E6F86; }

function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// 출발지마다 가장 자주 오는 버스 한 줄
function transportSummary() {
  if (isEmpty(D.transport)) return preparing("이동 안내 준비 중입니다");
  const freq = b => Number(String(b.freq || "").replace(/[^0-9]/g, "")) || 0;
  const rows = D.transport.map(t => {
    const opts = t.options || [];
    const bus = opts.filter(o => o.type === "bus").sort((x, y) => freq(y) - freq(x))[0];
    const taxi = opts.find(o => o.type === "taxi"), walk = opts.find(o => o.type === "walk");
    const from = t.from.replace(/^강릉\s+/, "") + (t.board ? ` (${t.board.replace(/\s*정류장$/, "")})` : "");
    return `<tr><td>${esc(from)}</td>
      <td>${bus ? `<span class="bus-no">${esc(bus.no)}</span> ${esc(bus.time || "")}` : "--"}</td>
      <td>${taxi ? esc([taxi.time, taxi.fare].filter(Boolean).join(", ")) : "--"}</td>
      <td>${walk ? esc(walk.time || "") : "--"}</td></tr>`;
  }).join("");
  const first = D.transport[0];
  const note = [first.stop ? `버스는 ${first.stop} 정류장에서 내려요.` : "", first.busFare ? `요금 ${first.busFare}, 평일 기준이에요.` : ""].join(" ");
  return `
    <div class="tbl"><table class="sum-table">
      <thead><tr><th>출발지</th><th>자주 오는 버스</th><th>택시</th><th>도보</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="tnote">${esc(note)}</p>`;
}

// 체험 목록 그리기 (선택한 조건으로 거르고, 같은 업체끼리 묶기)
function renderExperiences(selected) {
  if (isEmpty(D.experiences)) return preparing("체험 정보 준비 중입니다", "강릉 마리나 체험 정보를 모으고 있어요.");
  const groups = expGroups(selected);
  if (groups.length === 0) return preparing("조건에 맞는 체험이 없어요", "다른 조건을 골라 보세요.");
  window.__expSel = selected;
  const keep = groups.find(g => g.id === window.__expCompany);
  const cur = keep || groups[0];
  window.__expCompany = cur.id;
  return `
    <div class="exp-cards">
      <p class="muted company-hint">업체 카드를 누르면 아래에 코스가 나와요.</p>
      <div class="cc-grid">${groups.map(g => companyCard(g, g.id === cur.id, selected.length > 0)).join("")}</div>
      <div class="cd" id="exp-detail">${companyDetail(cur)}</div>
    </div>`;
}

// 조건에 맞는 코스를 업체별로 묶기 (업체 순서 = companies 순서)
function expGroups(selected) {
  const list = selected.length
    ? D.experiences.filter(e => selected.every(s => (e.tags || []).includes(s)))
    : D.experiences;
  const order = id => { const i = (D.companies || []).findIndex(c => c.id === id); return i < 0 ? 99 : i; };
  const groups = [];
  list.forEach(e => {
    let g = groups.find(x => x.id === e.company);
    if (!g) groups.push(g = { id: e.company, c: (D.companies || []).find(c => c.id === e.company), items: [] });
    g.items.push(e);
  });
  return groups.sort((a, b) => order(a.id) - order(b.id));
}

// 이름 끝 글자에 받침이 있으면 "이라고도", 없으면 "라고도"
function rago(word) {
  const code = String(word || "").trim().slice(-1).charCodeAt(0) - 0xAC00;
  return (code >= 0 && code <= 11171 && code % 28 !== 0) ? "이라고도" : "라고도";
}

// 업체 묶음: 공통 정보 한 번 + 코스 표 (퍼블릭 / 프라이빗 / 특별 패키지)
const COURSE_TYPES = [
  { key: "public",  label: "퍼블릭", desc: "다른 손님과 함께 타요" },
  { key: "private", label: "프라이빗", desc: "우리 일행만 타요 (요금은 전세 기준)" },
  { key: "special", label: "특별 패키지", desc: "" }
];
function scheduleBox(c) {
  if (isEmpty(c.schedule)) return "";
  const m = new Date().getMonth() + 1;
  const now = c.schedule.find(s => (s.months || []).includes(m));
  const list = s => `<ul class="sch-times">${s.times.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
  return `
    <div class="schedule">
      <p class="sch-head"><b>운항 시간</b>${now ? ` 이번 달(${esc(now.label)})` : ""}</p>
      ${now ? list(now) : ""}
      <details>
        <summary>다른 달 운항 시간 보기</summary>
        ${c.schedule.map(s => `<div class="sch-row"><span>${esc(s.label)}</span>${list(s)}</div>`).join("")}
      </details>
    </div>`;
}

// 가격 글자에서 가장 싼 값 찾기 ("1인 30,000원" → 30000)
function minPrice(items) {
  let best = null;
  items.forEach(e => {
    const m = String(e.price || "").match(/([\d,]+)\s*원/);
    if (!m) return;
    const n = Number(m[1].replace(/,/g, ""));
    if (n && (!best || n < best.n)) best = { n, per: /1인/.test(e.price) };
  });
  return best ? `${best.per ? "1인 " : ""}${best.n.toLocaleString("ko-KR")}원부터` : "";
}

// 업체 특징 (코스 태그에서 모아요)
function companyFeatures(items) {
  const has = t => items.some(e => (e.tags || []).includes(t));
  const f = [];
  if (has("오전")) f.push("오전 코스");
  if (has("노을 시간대")) f.push("노을 코스");
  if (has("반려동물 동반")) f.push("반려동물 가능");
  if (items.some(e => e.type === "special")) f.push("특별 패키지");
  return f;
}

// 업체 카드: 이름·코스 수·특징·최저가
function companyCard(g, on, filtered) {
  const c = g.c || { id: g.id, name: g.id };
  const prices = COURSE_TYPES.filter(t => t.key !== "special").map(t => {
    const v = minPrice(g.items.filter(e => e.type === t.key));
    return v ? `<span>${esc(t.label)}<b>${esc(v)}</b></span>` : "";
  }).join("");
  const feats = companyFeatures(g.items).map(f => `<span>${esc(f)}</span>`).join("");
  return `
    <button type="button" class="cc" data-company="${esc(g.id)}" aria-pressed="${on}">
      <div>
        <h3>${esc(c.name)}</h3>

/* ----- 날씨 쉬운 말 도우미 ----- */
const toNum = v => (v === "" || v == null || isNaN(Number(v))) ? NaN : Number(v);
function easyText(kind, value) {
  const list = (D.easy || {})[kind];
  const v = toNum(value);
  if (!list || isNaN(v)) return "";
  const hit = list.find(l => l.under === undefined || v < l.under);
  return hit ? hit.text : "";
}
// 바람·파고·특보로 그날 상태 고르기 (값이 하나도 없으면 null)
function dayStatus(wind, wave, alert) {
  const w = toNum(wind), h = toNum(wave);
  const a = String(alert || "");
  const storm = /풍랑/.test(a);
  if (isNaN(w) && isNaN(h) && !storm) return null;
  for (const d of D.easy.day) {
    if (d.key === "good") return d;
    if ((d.key === "stop" && storm) || (!isNaN(w) && w >= d.wind) || (!isNaN(h) && h >= d.wave)) return d;
  }
  return null;
}
function currentValue(id) { const w = (D.live.weather || []).find(x => x.id === id); return w ? w.value : ""; }
function currentStatus() { return dayStatus(currentValue("wind"), currentValue("wave"), currentValue("alert")); }
function dayBadge(st, short = false) {
  return st
    ? `<span class="day-badge day-${st.key}">${esc(short ? st.short : st.text)}</span>`
    : `<span class="day-badge day-none">${short ? "--" : "상태 확인 중"}</span>`;
}

/* ----- 날짜 도우미 ----- */
const WEEKDAY = ["일", "월", "화", "수", "목", "금", "토"];
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function findDay(list, d) { return (list || []).find(x => x.date === dateKey(d)) || {}; }
const show = (v, unit = "") => (toNum(v) === toNum(v)) ? esc(v + unit) : "--";

/* ----- 표지(휴대폰)용 날씨 한 줄 요약 ----- */
function liveSummary() {
  const part = (label, id, unit) => {
    const v = currentValue(id), e = easyText(id, v);
    return `<span>${label} <b>${show(v, unit)}</b>${e ? ` <em>${esc(e)}</em>` : ""}</span>`;
  };
  return `
    <a class="live-summary" href="#/live">
      <div class="ls-top"><b>오늘 바다</b>${dayBadge(currentStatus())}<span class="ls-more">자세히 보기</span></div>
      <div class="ls-line">${part("기온", "temp", "℃")}${part("바람", "wind", "m/s")}${part("파고", "wave", "m")}<span>일몰 <b>${esc(D.live.sunset || "--:--")}</b></span></div>
    </a>`;
}

/* ----- 이번 주 날씨 (오늘부터 7일) ----- */
function weekView() {
  const today = new Date();
  const n = Math.min(7, forecastDays());
  if (!n) return preparing("날씨 예보를 불러오고 있어요", "예보가 들어오면 날짜별로 보여 드려요.");
  const cards = Array.from({ length: n }, (_, i) => i).map(i => {
    const d = addDays(today, i), f = findDay(D.live.week, d);
    const label = i === 0 ? "오늘" : i === 1 ? "내일" : WEEKDAY[d.getDay()] + "요일";
    return `
      <div class="week-card ${i === 0 ? "today" : ""}">
        <div class="wk-day"><b>${label}</b><span>${d.getMonth() + 1}/${d.getDate()}</span></div>
        <div class="wk-sky">${esc(f.sky || "--")}</div>
        <div class="wk-temp"><b>${show(f.tmax, "°")}</b> / ${show(f.tmin, "°")}</div>
        <ul class="wk-info">
          <li>${icon("wind", 14)} ${show(f.wind, "m/s")}</li>
          <li>${icon("wave", 14)} ${show(f.wave, "m")}</li>
        </ul>
        ${dayBadge(dayStatus(f.wind, f.wave, f.alert), true)}
      </div>`;
  }).join("");
  return `<div class="week-row">${cards}</div>`;
}

/* ----- 앞으로 날씨 (달력 모양, 예보가 있는 날짜까지만) ----- */
function hasForecast(f) {
  return ["sky", "tmax", "tmin", "wind", "wave"].some(k => f[k] !== undefined && f[k] !== null && f[k] !== "");
}
// 오늘부터 예보가 있는 마지막 날까지의 날짜 수 (예보가 없으면 0)
function forecastDays() {
  const today = new Date();
  let last = -1;
  for (let i = 0; i < 31; i++) if (hasForecast(findDay(D.live.month, addDays(today, i)))) last = i;
  return last + 1;
}
function monthView() {
  const n = forecastDays();
  if (!n) return preparing("날씨 예보를 불러오고 있어요", "예보가 들어오면 날짜별로 보여 드려요.");
  const today = new Date();
  const lead = today.getDay();   // 오늘 앞의 빈칸 (일요일 시작)
  const head = WEEKDAY.map((w, i) => `<div class="cal-head ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</div>`).join("");
  const blanks = Array.from({ length: lead }, () => `<div class="cal-cell blank"></div>`).join("");
  const cells = Array.from({ length: n }, (_, i) => {
    const d = addDays(today, i), f = findDay(D.live.month, d);
    const st = dayStatus(f.wind, f.wave, f.alert);
    const label = (i === 0 || d.getDate() === 1) ? `${d.getMonth() + 1}/${d.getDate()}` : d.getDate();
    return `
      <div class="cal-cell ${i === 0 ? "today" : ""} ${st ? "st-" + st.key : ""}">
        <span class="cal-date ${d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : ""}">${label}</span>
        ${f.sky ? `<span class="cal-sky">${esc(f.sky)}</span>` : ""}
        ${st ? `<span class="cal-st">${esc(st.short)}</span>` : ""}
        <span class="cal-temp">${show(f.tmax, "°")}/${show(f.tmin, "°")}</span>
      </div>`;
  }).join("");
  return `<div class="cal">${head}${blanks}${cells}</div>`;
}

/* ----- 쉬운 말 기준표 (수치와 함께) ----- */
function easyLegend() {
  const range = (list, unit) => list.map((l, i) => {
    const from = i === 0 ? null : list[i - 1].under;
    const txt = l.under === undefined ? `${from}${unit} 이상` : from == null ? `${l.under}${unit} 미만` : `${from}~${l.under}${unit}`;
    return `<li><b>${esc(l.text)}</b> ${esc(txt)}</li>`;
  }).join("");
  const days = D.easy.day.map(d => `<li>${dayBadge(d)} <span>${esc(d.rule)}</span></li>`).join("");
  return `
    <div class="grid-2 legend">
      <div class="card"><h3>오늘 상태 배지</h3><ul class="legend-days">${days}</ul></div>
      <div class="card"><h3>수치 쉬운 말</h3>
        <div class="legend-scale"><span>바람</span><ul>${range(D.easy.wind, "m/s")}</ul></div>
        <div class="legend-scale"><span>파고</span><ul>${range(D.easy.wave, "m")}</ul></div>
        <div class="legend-scale"><span>기온</span><ul>${range(D.easy.temp, "℃")}</ul></div>
        <div class="legend-scale"><span>수온</span><ul>${range(D.easy.water, "℃")}</ul></div>
      </div>
    </div>`;
}

function pageNotFound() {

/* =====================================================================
   안목 코스 추천 (규칙 방식, 돈 안 드는 추천)
   요트 출항 시각 → 내리는 시각 → 그 시각에 문 연 가까운 곳을 오늘 바다 상태에 맞춰 이어 줘요.
   ===================================================================== */
const hm = s => { const m = String(s || "").match(/(\d{1,2}):(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : NaN; };
const fmt = min => { const h = Math.floor(min / 60) % 24, m = Math.round(min % 60); return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`; };
const durMin = s => { const t = String(s || ""); const h = t.match(/(\d+)\s*시간/), m = t.match(/(\d+)\s*분/); return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0) || 60; };
const PLAN_SLOTS = [ { key: "am", label: "오전" }, { key: "pm", label: "오후" }, { key: "sunset", label: "노을" } ];
const PLAN_PARTY = [ { key: "couple", label: "연인" }, { key: "family", label: "가족·아이" }, { key: "friends", label: "친구" }, { key: "pet", label: "반려동물" } ];

// 가게가 그 요일·시각에 열려 있나 (stay = 머무를 시간, 닫기 전 그만큼 남아야 해요)
function openAt(p, date, min, stay = 40) {
  if (!p.hours) return true;
  const wd = date.getDay();
  if ((p.off || []).includes(wd)) return false;
  return p.hours.some(h => {
    if (!String(h.d).includes(String(wd))) return false;
    const o = hm(h.o), c = hm(h.lo || h.c);
    return min >= o && min + Math.min(stay, 30) <= c;
  });
}
function openNowText(p, date = new Date()) {
  if (!p.hours) return "";
  const min = date.getHours() * 60 + date.getMinutes();
  if ((p.off || []).includes(date.getDay())) return "오늘 휴무";
  return openAt(p, date, min, 0) ? "지금 영업 중" : "지금은 문 닫음";
}
function mapLinks(p) {
  const kakao = "https://map.kakao.com/link/search/" + encodeURIComponent(p.name.replace(/\s*\(.*\)$/, "") + " 강릉");
  return `<div class="maplinks">${p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">네이버 지도</a>` : ""}<a href="${kakao}" target="_blank" rel="noopener">카카오맵</a></div>`;
}

// 날씨 (오늘 = 지금 값, 내일 = 예보)
function planWeather(dayOffset) {
  if (dayOffset === 0) {
    return { temp: toNum(currentValue("temp")), wind: toNum(currentValue("wind")), wave: toNum(currentValue("wave")),
             water: toNum(currentValue("water")), alert: currentValue("alert"), st: currentStatus() };
  }
  const f = findDay(D.live.week, addDays(new Date(), dayOffset));
  return { temp: toNum(f.tmax), wind: toNum(f.wind), wave: toNum(f.wave), water: NaN, alert: f.alert || "",
           st: dayStatus(f.wind, f.wave, f.alert) };
}

// 노을 코스 출항 시각: 업체 운항표의 '일몰' 칸 → 없으면 해 지는 시각 40분 전
function sunsetDepart(date) {
  const m = date.getMonth() + 1;
  for (const c of D.companies || []) {
    const s = (c.schedule || []).find(x => (x.months || []).includes(m));
    const t = s && (s.times || []).find(x => /일몰/.test(x));
    if (t) return hm(t);
  }
  const ss = hm(D.live.sunset);
  return isNaN(ss) ? 16 * 60 + 30 : Math.floor((ss - 40) / 10) * 10;
}

// 기본값: 지금 시각으로 고르기 (지났으면 내일)
function defaultPlan() {
  const now = new Date(), min = now.getHours() * 60 + now.getMinutes();
  const sd = sunsetDepart(now);
  if (min < 9 * 60) return { day: 0, slot: "am" };
  if (min < 13 * 60) return { day: 0, slot: "pm" };
  if (min < sd - 60) return { day: 0, slot: "sunset" };
  return { day: 1, slot: "sunset" };
}

function yachtCandidates(o) {
  const all = D.experiences || [];
  const tag = (e, t) => (e.tags || []).includes(t);
  let list;
  if (o.party === "pet") list = all.filter(e => tag(e, "반려동물 동반"));
  else list = all.filter(e => e.type === "public");
  if (o.slot === "am") list = list.filter(e => tag(e, "오전")).concat(list.filter(e => !tag(e, "오전") && !tag(e, "노을 시간대")));
  else if (o.slot === "sunset") list = list.filter(e => tag(e, "노을 시간대"));
  else list = list.filter(e => !tag(e, "오전") && !tag(e, "노을 시간대"));
  if (!list.length) list = all.filter(e => e.type !== "special");
  const price = e => { const m = String(e.price || "").match(/([\d,]+)\s*원/); return m ? Number(m[1].replace(/,/g, "")) : 1e9; };
  const order = id => (D.companies || []).findIndex(c => c.id === id);
  list = [...new Set(list)];
  return list.sort((a, b) => (o.sick ? durMin(a.duration) - durMin(b.duration) : 0) || price(a) - price(b) || order(a.company) - order(b.company));
}

// 코스 만들기
function makePlan(o) {
  const date = addDays(new Date(), o.day);
  const w = planWeather(o.day);
  const sunset = hm(D.live.sunset);
  const why = [];
  const steps = [];
  const storm = /풍랑/.test(w.alert) || (w.st && w.st.key === "stop");
  const cold = (w.temp < 12) || (w.wind >= 8) || (w.water < 15);
  const P = D.places || { cafe: [], food: [], walk: [] };
  const used = new Set();
  const swaps = o.swaps || {};

  if (w.st) why.push(`${o.day ? "내일" : "오늘"} 바다: ${w.st.text}${isNaN(w.wind) ? "" : ` (바람 ${w.wind}m/s${isNaN(w.wave) ? "" : `, 파도 ${w.wave}m`})`}`);

  let t;
  if (storm) {
    why.push("풍랑특보나 강한 바람으로 요트 운항이 어려울 수 있어 실내 위주로 바꿨어요. 운항이 취소되면 업체가 연락하고 환불해 줘요.");
    t = o.slot === "am" ? 10 * 60 : o.slot === "pm" ? 13 * 60 : (isNaN(sunset) ? 16 * 60 : sunset - 60);
    steps.push({ kind: "arrive", time: t, title: "안목 도착", sub: o.car ? "강릉항 공영주차장 (24시간 무료)" : "버스는 안목커피거리 정류장에서 내려요" });
  } else {
    const cands = yachtCandidates(o);
    const pick = cands[(o.yacht || 0) % Math.max(cands.length, 1)];
    const comp = pick && (D.companies || []).find(c => c.id === pick.company);
    const dep = o.slot === "am" ? 10 * 60 : o.slot === "pm" ? 14 * 60 : sunsetDepart(date);
    const dur = durMin(pick && pick.duration);
    steps.push({ kind: "arrive", time: dep - 60, title: "강릉항 요트마리나 도착",
      sub: [o.car ? "강릉항 공영주차장 (24시간 무료)" : "버스는 안목커피거리 정류장에서 내려요",
            "화장실은 안목 여행자센터에서 미리", o.sick ? "먹는 멀미약은 지금 (탑승 1시간 전)" : ""].filter(Boolean).join(" · ") });
    steps.push({ kind: "yacht", time: dep, title: pick ? `${comp ? comp.name + " " : ""}${pick.name}` : "요트 투어", exp: pick, comp,
      sub: pick ? `${pick.duration || ""}${pick.price ? " · " + pick.price : ""}` : "", count: cands.length });
    if (o.slot === "sunset" && !isNaN(sunset) && sunset > dep && sunset < dep + dur) {
      steps.push({ kind: "sun", time: sunset, title: "바다 위에서 노을", sub: "요트 위에서 해 지는 걸 봐요. 바람막이를 챙기세요." });
    }
    if (o.sick) why.push("멀미 걱정이 있어 짧은 코스를 먼저 골랐어요.");
    if (o.party === "pet") why.push("반려동물과 탈 수 있는 코스만 골랐어요. 가게는 반려동물 동반이 되는지 미리 확인해 주세요.");
    t = dep + dur + 10;   // 내려서 정리하는 10분
  }

  // 다음 장소 고르기 (문 연 곳 중 가까운 순, '바꾸기'로 다음 후보)
  const choose = (kind, list, stay, reason, idx) => {
    const ok = list.filter(p => !used.has(p.name) && openAt(p, date, t + (p.walk || 0), stay))
                   .sort((a, b) => (a.walk || 0) - (b.walk || 0));
    if (!ok.length) return false;
    const p = ok[(swaps[idx] || 0) % ok.length];
    used.add(p.name);
    t += p.walk || 0;
    steps.push({ kind, time: t, place: p, title: p.name, sub: reason, alt: ok.length, idx });
    t += stay;
    return true;
  };
  const mealTime = m => (m >= 11 * 60 && m <= 13 * 60 + 30) || (m >= 17 * 60 && m <= 19 * 60 + 30);
  let i = 0;
  const firstCafe = storm || cold || o.sick;
  if (firstCafe) choose("cafe", P.cafe, 50, storm ? "바깥 대신 실내에서 쉬어 가요" : o.sick ? "가까운 곳에서 먼저 쉬어 가요" : "바닷바람에 식은 몸, 따뜻한 음료로", i++);
  if (mealTime(t) || (t < 17 * 60 && t + 90 >= 17 * 60 && t >= 16 * 60)) {
    if (t < 17 * 60 && !mealTime(t)) t = 17 * 60;
    const fam = o.party === "family";
    const foods = fam ? P.food.slice().sort((a, b) => (/돈까스|버거|미역국/.test(b.menu || "") - /돈까스|버거|미역국/.test(a.menu || ""))) : P.food;
    choose("food", foods, 60, t >= 17 * 60 ? "저녁 식사" : "점심 식사", i++);
  }
  if (!firstCafe) choose("cafe", P.cafe, 50, "바다 보며 커피 한 잔", i++);
  // 노을·야경
  const walks = P.walk || [];
  if (!storm && w.wind < 14) {
    if (!isNaN(sunset) && t < sunset && sunset - t < 120 && o.slot !== "sunset") {
      t = sunset - 15;
      const beach = walks.find(x => !x.night);
      if (beach) steps.push({ kind: "walk", time: t, place: beach, title: "안목해변에서 노을 보기", sub: `해 지는 시각 ${D.live.sunset}` });
      t = sunset + 20;
    }
    if (!isNaN(sunset) && t >= sunset) {
      const bridge = walks.find(x => x.night);
      if (bridge) steps.push({ kind: "walk", time: t, place: bridge, title: "솔바람다리 야경", sub: w.wind >= 8 ? "바람이 강하니 짧게 걸어요" : "조명이 켜진 다리를 걸어요" });
    }
  }
  if (cold && !storm) why.push(`바람과 바다가 차가운 편이라 내린 뒤 따뜻한 실내를 먼저 넣었어요.`);
  why.push("가게는 그 시각에 문을 여는 곳 중 마리나에서 가까운 순으로 골랐어요.");
  return { o, date, steps, why, storm };
}

const STEP_LABEL = { arrive: "도착", yacht: "요트", sun: "해 지는 시각", cafe: "카페", food: "식사", walk: "산책" };
function planStep(s) {
  const walk = s.place ? (s.place.walkText || (s.place.walk ? `걸어서 ${s.place.walk}분` : "")) : "";
  const swap = (s.kind === "yacht" && s.count > 1) ? `<button type="button" class="pl-swap" data-swap="yacht">다른 요트</button>`
             : (s.alt > 1 ? `<button type="button" class="pl-swap" data-swap="${s.idx}">다른 곳</button>` : "");
  return `
    <li class="pl-it pl-${s.kind}">

document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-pl], .pl-swap, [data-share], .pl-more");
  if (!b) return;
  const o = window.__plan;
  if (b.matches(".pl-more")) { if (b.dataset.company) window.__expCompany = b.dataset.company; return; }
  if (b.matches("[data-share]")) { sharePlan(); return; }

  } else {

    if (v === "toggle") o[k] = !o[k];

async function sharePlan() {
  const plan = makePlan(window.__plan);
  const text = plan.steps.map(s => `${fmt(s.kind === "yacht" || s.kind === "sun" ? s.time : Math.round(s.time / 5) * 5)} ${s.title}`).join("\n");
  const url = location.origin + location.pathname + "#/plan";
  const data = { title: "요트핏 안목 코스", text: `${plan.date.getMonth() + 1}월 ${plan.date.getDate()}일 안목 코스\n${text}`, url };
  try {
    if (navigator.share) { await navigator.share(data); return; }
    await navigator.clipboard.writeText(data.text + "\n" + url);
    toast("코스를 복사했어요. 메신저에 붙여 넣으세요.");
  } catch (err) { /* 공유 취소 */ }
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");

// 시간대에 따라 하늘색이 바뀌는 첫 화면
function skyClass(now = new Date()) {
  const m = now.getHours() * 60 + now.getMinutes(), ss = hm(D.live.sunset);
  if (m < 6 * 60 || (!isNaN(ss) && m > ss + 40)) return "sky-night";
  if (!isNaN(ss) && m >= ss - 90) return "sky-sunset";
  if (m < 8 * 60) return "sky-dawn";
  return "sky-day";
}
const HERO_TITLE = { good: "요트 타기\n좋은 날이에요", mild: "배가 조금\n흔들리는 날이에요", rough: "배가 많이\n흔들리는 날이에요", stop: "오늘은 요트 운항이\n어려울 수 있어요" };
function heroSea() {
  const st = currentStatus();
  const wave = toNum(currentValue("wave"));
  const amp = isNaN(wave) ? 6 : Math.max(3, Math.min(16, 4 + wave * 8));   // 파도가 높을수록 물결도 커요
  const path = `M0 ${20} ` + Array.from({ length: 7 }, (_, i) => `q 32 ${i % 2 ? amp : -amp} 64 0`).join(" ") + " V60 H0 Z";
  const stat = (label, id, unit) => {
    const v = currentValue(id), e = easyText(id, v);
    return `<div><span>${label}</span><b>${show(v, unit)}</b><em>${esc(e || "확인 중")}</em></div>`;
  };
  const now = new Date();
  const title = st ? HERO_TITLE[st.key] : "오늘 강릉 바다를\n확인하고 있어요";
  return `
    <section class="hero ${skyClass(now)}">
      <div class="hero-sky"><i class="hero-sun"></i></div>
      <div class="hero-boat">${icon("boat", 56)}</div>
      <svg class="hero-wave" viewBox="0 0 448 60" preserveAspectRatio="none" aria-hidden="true"><path d="${path}"/></svg>
      <div class="hero-sea"></div>
      <div class="container hero-in">
        <p class="hero-kicker">강릉항 요트마리나 · 오늘 바다 ${esc(D.live.updated ? D.live.updated + " 기준" : "")}</p>

/* =====================================================================
   주소(#/...)에 따라 페이지 바꾸기
   ===================================================================== */
function router() {
  try { routerInner(); } catch (err) {
    console.error(err);
    document.getElementById("app").innerHTML = pageNotFound();
  }
}
function routerInner() {
  const hash = location.hash || "#/";
  const [pathPart, queryPart] = hash.slice(1).split("?");
  const parts = pathPart.split("/").filter(Boolean);   // 예: ["category", "pet"]
  const params = new URLSearchParams(queryPart || "");

  let html;
  switch (parts[0]) {
    case undefined:   html = pageHome(); break;
    case "result":    html = pagePlan(); break;
    case "ai":        html = pagePlan(); break;
    case "plan":      html = pagePlan(); break;
    case "category":  html = pageCategory(parts[1]); break;
    case "marina":    html = pageMarina(); break;
    case "yacht":     html = pageYacht(); break;
    case "booking":   html = pageBooking(); break;
    case "transport": html = pageTransport(); break;
    case "tour":      html = pageTour(parts[1]); break;
    case "safety":    html = pageSafety(parts[1]); break;
    case "live":      html = pageLive(); break;
    default:          html = pageNotFound();
  }
  document.getElementById("app").innerHTML = html;

  // 현재 메뉴 표시
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.classList.toggle("current", hash.startsWith(a.dataset.nav)));
  document.querySelector(".nav")?.classList.remove("open");
  renderTabbar();

  // 안전 가이드 특정 항목으로 왔으면 그 위치로, 아니면 맨 위로
  const focus = parts[0] === "safety" && parts[1] && document.getElementById("safety-tiles");
  if (focus) focus.scrollIntoView({ behavior: "smooth", block: "center" });
  else if (!window.__keepScroll) window.scrollTo(0, 0);
}

window.addEventListener("hashchange", router);

/* ---------- 날씨 불러오기 (weather.json) ----------
   GitHub Actions가 저장한 파일을 읽어 정보 영역의 live 칸을 채워요.
   못 불러오면 조용히 넘어가고 지금처럼 '--'로 보여요. */
async function loadWeather() {
  const urls = [D.live.weatherUrl, "weather.json"].filter(Boolean);
  for (const u of urls) {
    try {
      const res = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) continue;
      const w = await res.json();
      if (!w || !w.current) continue;
      applyWeather(w);
      return true;
    } catch (e) { /* 다음 주소로 */ }
  }
  return false;
}

function applyWeather(w) {
  const L = D.live;
  const map = { temp: "temp", wind: "wind", wave: "wave", water: "water", alert: "alert" };
  (L.weather || []).forEach(x => {
    const v = w.current[map[x.id]];
    x.value = (v === null || v === undefined) ? "" : String(v);
  });
  if (w.sunset) L.sunset = w.sunset;
  if (w.updated) L.updated = w.updated;
  if (Array.isArray(w.days)) { L.week = w.days; L.month = w.days; }
  L.source = w.source || "기상청";
  // 날씨가 보이는 화면이면 다시 그리기 (스크롤 위치는 그대로)
  const h = location.hash || "#/";
  if (h === "#/" || h === "#" || h.startsWith("#/live") || h.startsWith("#/plan")) {
    window.__keepScroll = true;   // 날씨만 바뀐 거라 스크롤은 그대로
    router();
    window.__keepScroll = false;
  }
  renderFooter();
}
renderHeader();
// 업체 카드 누르면 아래 코스만 바꿔 그리기 (화면 위치 그대로, 휴대폰은 코스 위치로 이동)
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".cc");
  if (!b) return;
  const wrap = b.closest(".exp-cards");
  const g = expGroups(window.__expSel || []).find(x => x.id === b.dataset.company);
  if (!wrap || !g) return;
  window.__expCompany = g.id;
  wrap.querySelectorAll(".cc").forEach(x => {
    const on = x === b;
    x.setAttribute("aria-pressed", String(on));
    const more = x.querySelector(".cc-more");
    if (more) more.textContent = on ? "코스 보는 중" : "코스 보기";
  });
  const d = wrap.querySelector("#exp-detail");
  d.innerHTML = companyDetail(g);
  if (window.innerWidth <= 640) d.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
});

// 안전 가이드 단계 버튼: 표지판만 바꿔 그리기 (화면 위치 그대로)
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".sg-step");
  if (!b) return;
  const step = D.safety.find(s => s.id === b.dataset.step);
  document.querySelectorAll(".sg-step").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  const box = document.getElementById("safety-tiles");
  if (box) box.innerHTML = safetyTiles(step);
  history.replaceState(null, "", "#/safety/" + b.dataset.step);
});

renderFooter();
router();
loadWeather();
setInterval(loadWeather, 30 * 60 * 1000);   // 30분마다 다시 확인

  </script>
</body>
</html>
