<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요트핏 | 강릉 마리나 가이드</title>
  <meta name="description" content="강릉 마리나의 체험, 가는 방법, 주변 관광, 안전 수칙을 한곳에서 확인하고 AI로 방문 코스를 추천받으세요.">
  <!--
    ★ 요트핏 웹사이트 — 이 파일 하나만 있으면 사이트가 작동합니다.
    ★ 내용(요금, 업체, 장소 등)을 고칠 때는 아래 "정보 영역" (window.SITE_DATA) 부분만 고치세요.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   요트핏 디자인 파일 (style.css)
   색을 바꾸고 싶으면 맨 위 :root 의 색 코드만 바꾸면 전체가 바뀝니다.
   ===================================================================== */
:root {
  --navy: #0B2A3F;        /* 진한 남색: 히어로, 강조 박스 */
  --bg: #F4F8FA;          /* 연한 하늘색 배경 */
  --card: #FFFFFF;        /* 카드 */
  --line: #DDE8EC;        /* 카드 테두리 */
  --chip-bg: #E3F1F4;     /* 칩 배경 */
  --chip-text: #0B4A5A;   /* 칩 글자 */
  --sub: #3C6270;         /* 보조 글자 */
  --orange: #F5A25D;      /* 주황 버튼·강조 */
  --text: #0B2A3F;
  --radius: 18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Noto Sans KR", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  word-break: keep-all;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
main { flex: 1; }
a { color: inherit; text-decoration: none; }
button, textarea { font-family: inherit; }
.icon { flex-shrink: 0; vertical-align: middle; }

.container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.container.narrow { max-width: 760px; }

/* ---------- 상단 ---------- */
#site-header {
  background: #fff;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
}
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--navy); color: var(--orange);
  display: grid; place-items: center;
}
.logo-text { font-weight: 900; font-size: 20px; line-height: 1.1; display: flex; flex-direction: column; }
.logo-text small { font-size: 11px; font-weight: 500; color: var(--sub); letter-spacing: .02em; }

.nav { display: flex; gap: 4px; align-items: center; }
.nav a {
  padding: 8px 12px; border-radius: 10px;
  font-size: 15px; font-weight: 500; color: var(--sub);
  transition: background .15s, color .15s;
}
.nav a:hover { background: var(--bg); color: var(--navy); }
.nav a.current { color: var(--navy); font-weight: 700; }
.nav a.nav-ai { background: var(--navy); color: #fff; margin-left: 6px; }
.nav a.nav-ai:hover, .nav a.nav-ai.current { background: #143D58; color: #fff; }

.menu-btn { display: none; background: none; border: 0; width: 40px; height: 40px; cursor: pointer; }
.menu-btn span { display: block; width: 22px; height: 2px; background: var(--navy); margin: 5px auto; border-radius: 2px; }

/* ---------- 하단 ---------- */
#site-footer { background: #fff; border-top: 1px solid var(--line); margin-top: 64px; }
.footer-inner { padding: 28px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.footer-inner p { color: var(--sub); font-size: 14px; }

/* ---------- 히어로 ---------- */
.hero { background: var(--navy); color: #fff; padding: 72px 0; }
.hero-inner { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; }
.eyebrow { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .16em; color: var(--sub); margin-bottom: 12px; }
.eyebrow.light { color: var(--orange); }
.hero h1 { font-size: 44px; font-weight: 900; line-height: 1.3; margin-bottom: 20px; }
.hero p { font-size: 17px; color: #C7D6DE; }

/* AI 입력 카드 */
.ai-card {
  background: #fff; color: var(--text);
  border-radius: 20px; padding: 28px;
  box-shadow: 0 20px 40px rgba(0,0,0,.18);
  display: flex; flex-direction: column; gap: 14px;
}
.ai-card-wide { box-shadow: none; border: 1px solid var(--line); }
.ai-card-title { font-size: 18px; font-weight: 700; }
.ai-card textarea {
  width: 100%; resize: vertical; min-height: 110px;
  border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; font-size: 16px; line-height: 1.6;
  background: var(--bg); color: var(--text);
}
.ai-card textarea:focus { outline: 2px solid var(--orange); outline-offset: 1px; background: #fff; }

/* ---------- 버튼 ---------- */
.btn-orange {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--orange); color: var(--navy);
  border: 0; border-radius: 14px; padding: 15px 22px;
  font-size: 17px; font-weight: 700; cursor: pointer;
  transition: filter .15s, transform .15s;
}
.btn-orange:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn-orange.sm { padding: 9px 14px; font-size: 14px; border-radius: 10px; }
.btn-line {
  display: inline-flex; align-items: center; padding: 9px 14px;
  border: 1px solid var(--line); border-radius: 10px;
  font-size: 14px; font-weight: 500; color: var(--chip-text); background: #fff;
}
.btn-line:hover { border-color: var(--chip-text); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; }

/* ---------- 섹션 ---------- */
.section { padding: 56px 0; }
.pt-0 { padding-top: 0; }
.section-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.section-title.sm { font-size: 20px; }
.section-desc { color: var(--sub); margin-bottom: 20px; }
.section-title + .chip-row, .section-title + .grid-3, .section-title + .preparing { margin-top: 16px; }

/* 하위 페이지 제목 영역 */
.page-head { background: #fff; border-bottom: 1px solid var(--line); padding: 44px 0 36px; }
.page-head .eyebrow { color: var(--orange); }
.page-head h1 { font-size: 32px; font-weight: 900; margin-bottom: 6px; }
.page-head p { color: var(--sub); }

/* ---------- 칩 ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
.chip-row.small { gap: 6px; }
.chip {
  display: inline-flex; align-items: center;
  background: var(--chip-bg); color: var(--chip-text);
  border: 1px solid transparent; border-radius: 999px;
  padding: 7px 14px; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: background .15s, border-color .15s;
}
.chip-row.small .chip { padding: 5px 11px; font-size: 13px; cursor: default; }
.chip-lg { padding: 12px 22px; font-size: 16px; }
a.chip:hover, button.chip:hover { border-color: var(--chip-text); }
.chip.active { background: var(--navy); color: #fff; }
.chip-empty { background: #fff; border: 1px dashed #A9C4CC; color: var(--sub); }

/* ---------- 카드 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 24px;
  display: flex; flex-direction: column; gap: 8px;
}
a.card { transition: transform .15s, box-shadow .15s, border-color .15s; }
a.card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(11,42,63,.08); border-color: #BCD3DA; }
.card h3 { font-size: 19px; font-weight: 700; }
.card p { color: var(--sub); }
.card-icon {
  width: 48px; height: 48px; border-radius: 14px;
  background: var(--chip-bg); color: var(--chip-text);
  display: grid; place-items: center; margin-bottom: 6px;
}
.card-label { font-size: 14px !important; font-weight: 700; color: var(--sub); margin-bottom: 4px; }
.more { margin-top: 8px; font-size: 14px; font-weight: 700; color: var(--chip-text); }
.muted { color: var(--sub); }

.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

/* 주변 관광 카드의 이동 정보 */
.move-info {
  margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--line);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  font-size: 13px; color: var(--sub);
}
.move-info b { color: var(--chip-text); margin-left: auto; }
.tour-card p { font-size: 15px; }

/* 체험 카드 */
.info-list { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--sub); }
.info-list li { display: flex; align-items: center; gap: 6px; }

/* 준비 중 카드 */
.soon-card h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag-soon {
  font-size: 12px; font-weight: 700; color: var(--navy);
  background: #FDE7D3; border-radius: 999px; padding: 3px 10px;
}

/* ---------- 준비 중 상자 ---------- */
.preparing {
  background: #fff; border: 1px dashed #B8CFD6; border-radius: var(--radius);
  padding: 44px 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.preparing-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: #FDE7D3; color: #C26A1F;
  display: grid; place-items: center; margin-bottom: 6px;
}
.preparing strong { font-size: 18px; }
.preparing p { color: var(--sub); font-size: 15px; }
.placeholder-text { color: #7E9AA4 !important; font-size: 14px; }

/* ---------- AI 결과 페이지 ---------- */
.result-grid { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
.result-side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 92px; }
.quote { font-size: 16px; color: var(--text) !important; background: var(--bg); border-radius: 12px; padding: 14px 16px; }
.text-link { font-size: 14px; font-weight: 700; color: var(--chip-text); }
.note { font-size: 13px; margin-top: 6px; }
.result-main { display: flex; flex-direction: column; gap: 14px; }
.course-title { font-size: 28px; font-weight: 900; }
.mb-16 { margin-bottom: 4px; }

.step-card { flex-direction: row; gap: 18px; align-items: flex-start; }
.step-card.best { border: 2px solid var(--orange); box-shadow: 0 10px 24px rgba(245,162,93,.15); }
.step-num {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--chip-bg); color: var(--chip-text);
  display: grid; place-items: center; font-weight: 900; font-size: 18px;
}
.step-card.best .step-num { background: var(--orange); color: var(--navy); }
.step-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.step-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { background: var(--orange); color: var(--navy); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }

.navy-box {
  background: var(--navy); color: #fff; border-radius: var(--radius);
  padding: 22px 24px; display: flex; flex-direction: column; gap: 8px;
}
.navy-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: #9FB6C2; }
.navy-links a { color: var(--orange); font-weight: 700; }
.navy-links a:hover { text-decoration: underline; }
.disclaimer { font-size: 13px; color: var(--sub); }

/* AI 입력 페이지 예시 문장 */
.examples { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.example {
  text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 18px; font-size: 15px; color: var(--sub); cursor: pointer;
}
.example:hover { border-color: var(--orange); color: var(--navy); }

/* 안전 가이드 */
.safety-card.focus { border: 2px solid var(--orange); }
.check-list { padding-left: 20px; color: var(--text); }

/* 여백 도우미 */
.mt-24 { margin-top: 24px; }
.mt-32 { margin-top: 32px; }
.mt-48 { margin-top: 48px; }
.center { text-align: center; }

/* =====================================================================
   반응형: 화면이 좁아지면 카드가 아래로 쌓임
   ===================================================================== */
@media (max-width: 1080px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .nav a { padding: 8px 9px; font-size: 14px; }
}

@media (max-width: 900px) {
  .menu-btn { display: block; }
  .nav {
    display: none; position: absolute; top: 68px; left: 0; right: 0;
    background: #fff; border-bottom: 1px solid var(--line);
    flex-direction: column; align-items: stretch; padding: 12px 24px 20px; gap: 2px;
  }
  .nav.open { display: flex; }
  .nav a { padding: 12px 10px; font-size: 16px; }
  .nav a.nav-ai { margin: 8px 0 0; text-align: center; }

  .hero { padding: 48px 0; }
  .hero-inner { grid-template-columns: 1fr; gap: 32px; }
  .hero h1 { font-size: 34px; }
  .br-pc { display: none; }

  .grid-3 { grid-template-columns: 1fr; }
  .result-grid { grid-template-columns: 1fr; }
  .result-side { position: static; }
}

@media (max-width: 600px) {
  .container { padding: 0 16px; }
  .grid-2, .grid-4 { grid-template-columns: 1fr; }
  .hero h1 { font-size: 28px; }
  .hero p { font-size: 15px; }
  .ai-card { padding: 20px; }
  .section { padding: 40px 0; }
  .section-title { font-size: 22px; }
  .page-head h1 { font-size: 26px; }
  .chip-lg { padding: 10px 16px; font-size: 15px; }
  .step-card { padding: 18px; gap: 14px; }
  .course-title { font-size: 23px; }
}

  </style>
</head>
<body>
  <header id="site-header"></header>
  <main id="app">
    <noscript><p style="padding:40px;text-align:center">이 사이트는 자바스크립트가 필요합니다. 브라우저 설정에서 자바스크립트를 켜 주세요.</p></noscript>
  </main>
  <footer id="site-footer"></footer>

  <script>
/* =====================================================================
   요트핏 정보 영역 (원래 data.js)
   ---------------------------------------------------------------------
   ● 사이트에 보이는 "내용"은 전부 이 파일 하나에서 고칩니다.
   ● 목록( [ ] )이 비어 있으면 사이트에 자동으로 "준비 중" 화면이 뜹니다.
   ● 확인되지 않은 정보(요금, 운영 시간, 업체명 등)는 지어내지 말고
     비워 두거나 "[ ]"로 적어 주세요.
   ● 고칠 때 주의: 따옴표(" "), 쉼표(,), 괄호({ } [ ])를 지우지 마세요.
   ===================================================================== */

window.SITE_DATA = {

  /* ---------- 1. 사이트 기본 정보 ---------- */
  site: {
    name: "요트핏",
    subtitle: "강릉 마리나 가이드",
    contact: "[연락처 입력]",
    notice: "요금과 운영 시간은 업체 사정에 따라 달라질 수 있습니다."
  },

  /* ---------- 2. 기능 켜기/끄기 ----------
     true  = 사용 / false = "준비 중" 화면 표시
     나중에 기능을 완성하면 true 로 바꾸면 됩니다. */
  features: {
    ai: false,        // AI 코스 추천 (AI API 연결 후 true)
    booking: false,   // 앱 내 예약 (서버/DB 연결 후 true)
    reviews: false    // 탑승자 리뷰 (서버/DB 연결 후 true)
  },

  /* ---------- 3. 카테고리 (메인 화면 칩 7개) ----------
     options = 카테고리를 눌렀을 때 고를 수 있는 항목 */
  categories: [
    { id: "companion",  name: "동행자",          options: ["가족", "연인·부부", "친구", "혼자", "단체"] },
    { id: "purpose",    name: "이용 목적",       options: ["노을 감상", "기념일", "가족 나들이", "휴식", "사진 촬영"] },
    { id: "time",       name: "요일·시간",       options: ["평일", "주말", "오전", "오후", "노을 시간대"] },
    { id: "type",       name: "퍼블릭/프라이빗", options: ["퍼블릭(합승)", "프라이빗(단독)"] },
    { id: "seasick",    name: "뱃멀미 정도",     options: ["괜찮아요", "조금 걱정돼요", "많이 걱정돼요"] },
    { id: "pet",        name: "반려동물·유모차", options: ["반려동물 동반", "유모차 동반"] },
    { id: "wheelchair", name: "휠체어",          options: ["휠체어 이용"] }
  ],

  /* ---------- 4. 마리나 소개 ----------
     예시) { title: "[마리나 이름]", text: "[소개 문장]" } */
  marina: [],

  /* ---------- 5. 요트·체험 상품 ----------
     예시 (tags에는 위 카테고리 options 글자를 그대로 적으면 필터에 걸립니다)
     {
       name: "[상품 이름]",
       company: "[업체명]",
       price: "[요금]",
       hours: "[운영 시간]",
       duration: "[소요 시간]",
       place: "[출발 장소]",
       phone: "[전화번호]",
       link: "[업체 홈페이지 주소]",
       tags: ["프라이빗(단독)", "노을 시간대", "연인·부부"]
     } */
  experiences: [],

  /* ---------- 6. 마리나 시설 ----------
     예시) { name: "[시설 이름]", text: "[설명]" } */
  facilities: [],

  /* ---------- 7. 가는 방법 ----------
     예시) { from: "[강릉역]", how: "[버스 ○번]", time: "[약 ○분]", text: "[설명]" } */
  transport: [],

  /* ---------- 8. 마리나 주변 관광 (메인 화면 카드 4개) ----------
     items 예시) { name: "[장소 이름]", move: "[도보]", time: "[약 ○분]", text: "[설명]" } */
  tours: [
    { id: "beach", name: "안목해변 산책", desc: "바다를 따라 걷는 산책 코스", items: [] },
    { id: "cafe",  name: "카페",          desc: "투어 전후 쉬어 가기 좋은 곳", items: [] },
    { id: "food",  name: "먹거리",        desc: "마리나 근처 식사 장소",       items: [] },
    { id: "etc",   name: "그 외 볼거리",   desc: "함께 둘러보면 좋은 곳",       items: [] }
  ],

  /* ---------- 9. 안전 가이드 (승선 안내 5종) ----------
     items 예시) ["[유의사항 1]", "[유의사항 2]"] */
  safety: [
    { id: "before",   name: "승선 전 필수 숙지 사항", desc: "탑승 전 꼭 알아야 할 기본 유의사항",     items: [] },
    { id: "clothes",  name: "복장 가이드",            desc: "계절·시간대·해상 환경에 맞는 복장",       items: [] },
    { id: "seasick",  name: "뱃멀미 예방법",          desc: "멀미를 줄이는 사전 준비와 대처 방법",     items: [] },
    { id: "etiquette",name: "마리나 에티켓",          desc: "마리나 시설과 선상에서 지킬 매너",        items: [] },

      ${isEmpty(s.items)
        ? '<p class="placeholder-text">준비 중입니다.</p>'
        : `<ul class="check-list">${s.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`}
    </div>`).join("");
  return `
    ${pageHead("SAFETY GUIDE", "안전 가이드", "요트가 처음이어도 안전하고 즐겁게 탈 수 있도록 미리 알려드려요.")}
    <section class="section"><div class="container grid-2 safety-grid">${cards}</div></section>`;
}

/* ---------- 없는 주소 ---------- */
function pageNotFound() {
  return `<section class="section"><div class="container narrow">
    ${preparing("준비 중인 페이지입니다", "메뉴에서 다른 페이지를 선택해 주세요.")}
  </div></section>`;
}

/* =====================================================================
   공통 상단/하단
   ===================================================================== */
function renderHeader() {
  const links = MENU.map(m =>
    `<a href="${m.path}" class="${m.highlight ? "nav-ai" : ""}" data-nav="${m.path}">${m.label}</a>`).join("");
  document.getElementById("site-header").innerHTML = `
    <div class="container header-inner">
      <a href="#/" class="logo">
        <span class="logo-mark">${icon("boat", 22)}</span>
        <span class="logo-text">${esc(D.site.name)}<small>${esc(D.site.subtitle)}</small></span>
      </a>
      <button class="menu-btn" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav">${links}</nav>
    </div>`;

  const btn = document.querySelector(".menu-btn");
  const nav = document.querySelector(".nav");
  btn.addEventListener("click", () => {
    const open = nav.classList.toggle("open");
    btn.setAttribute("aria-expanded", open);
  });
}

function renderFooter() {
  document.getElementById("site-footer").innerHTML = `
    <div class="container footer-inner">
      <strong>${esc(D.site.name)}</strong>
      <p>문의 ${esc(D.site.contact)} · ${esc(D.site.notice)}</p>
    </div>`;
}

/* =====================================================================
   주소(#/...)에 따라 페이지 바꾸기
   ===================================================================== */
function router() {
  try { routerInner(); } catch (err) {
    console.error(err);
    document.getElementById("app").innerHTML = pageNotFound();
  }
}
function routerInner() {
  const hash = location.hash || "#/";
  const [pathPart, queryPart] = hash.slice(1).split("?");
  const parts = pathPart.split("/").filter(Boolean);   // 예: ["category", "pet"]
  const params = new URLSearchParams(queryPart || "");

  let html;
  switch (parts[0]) {
    case undefined:   html = pageHome(); break;
    case "result":    html = pageResult(params); break;
    case "ai":        html = pageAI(); break;
    case "category":  html = pageCategory(parts[1]); break;
    case "marina":    html = pageMarina(); break;
    case "yacht":     html = pageYacht(); break;
    case "booking":   html = pageBooking(); break;
    case "transport": html = pageTransport(); break;
    case "tour":      html = pageTour(); break;
    case "safety":    html = pageSafety(parts[1]); break;
    default:          html = pageNotFound();
  }
  document.getElementById("app").innerHTML = html;

  // 현재 메뉴 표시
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.classList.toggle("current", hash.startsWith(a.dataset.nav)));
  document.querySelector(".nav")?.classList.remove("open");

  // 안전 가이드 특정 항목으로 왔으면 그 위치로, 아니면 맨 위로
  const focus = parts[0] === "safety" && parts[1] && document.getElementById("safety-" + parts[1]);
  if (focus) focus.scrollIntoView({ behavior: "smooth", block: "center" });
  else window.scrollTo(0, 0);
}

/* ---------- 클릭·입력 처리 ---------- */
document.addEventListener("submit", e => {
  const form = e.target.closest("[data-ai-form]");
  if (!form) return;
  e.preventDefault();
  const text = form.q.value.trim() || form.q.placeholder;
  location.hash = "#/result?q=" + encodeURIComponent(text);
});

document.addEventListener("click", e => {
  // 예시 문장 누르면 입력창에 채우기
  const ex = e.target.closest("[data-example]");
  if (ex) {
    const box = document.getElementById("ai-input");
    box.value = ex.dataset.example;
    box.focus();
    return;
  }
  // 카테고리 항목 고르기 (여러 개 선택 가능)
  const opt = e.target.closest(".option");
  if (opt) {
    const on = opt.getAttribute("aria-pressed") !== "true";
    opt.setAttribute("aria-pressed", on);
    opt.classList.toggle("active", on);
    const selected = [...document.querySelectorAll(".option.active")].map(b => b.dataset.option);
    document.getElementById("category-result").innerHTML = renderExperiences(selected);
  }
});

window.addEventListener("hashchange", router);
renderHeader();
renderFooter();
router();

  </script>
</body>
</html>
