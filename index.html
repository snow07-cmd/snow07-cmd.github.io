<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요트핏 | 강릉 마리나 가이드</title>
  <meta name="site-version" content="v14">
  <!-- 사이트 버전 v11 (2026-11-26) -->

  <meta name="description" content="강릉 마리나의 체험, 가는 방법, 주변 관광, 안전 수칙을 한곳에서 확인하고 AI로 방문 코스를 추천받으세요.">
  <!--
    ★ 요트핏 웹사이트 — 이 파일 하나만 있으면 사이트가 작동합니다.
    ★ 내용(요금, 업체, 장소 등)을 고칠 때는 아래 "정보 영역" (window.SITE_DATA) 부분만 고치세요.

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   요트핏 디자인 (v5, 안내 사이트형 / 회청색)
   색을 바꾸고 싶으면 맨 위 :root 의 색 코드만 바꾸면 전체가 바뀝니다.
   ===================================================================== */
:root {
  --bg: #F4F6F7;          /* 페이지 바탕 */
  --paper: #FFFFFF;       /* 판(패널) 바탕 */
  --ink: #1C2830;         /* 본문 글자 */
  --sub: #5D6B74;         /* 보조 글자 */
  --faint: #8A979E;       /* 흐린 글자 (빈 값) */
  --line: #DDE3E7;        /* 구분선 */
  --soft: #EBF0F2;        /* 연한 바탕 (칩, 표 머리) */
  --primary: #2C5A6E;     /* 대표색 (버튼, 링크) */
  --primary-dark: #22495A;
  --cover: #2C4653;       /* 표지 바탕 */
  --cover-sub: #B7C7CF;   /* 표지 보조 글자 */
  --tile: #3A5866;        /* 표지 바로가기 칸 */
  --good: #4E9A73;  --mild: #D9B44A;  --rough: #D98447;  --stop: #C25450;  /* 오늘 바다 4단계 */
  --r: 8px;               /* 판 모서리 */
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  font-family: "Noto Sans KR", system-ui, sans-serif;
  background: var(--bg); color: var(--ink);
  line-height: 1.6; word-break: keep-all;
  min-height: 100vh; display: flex; flex-direction: column;
}
main { flex: 1; }
a { color: inherit; text-decoration: none; }
button, textarea, input { font-family: inherit; }
.icon { flex-shrink: 0; vertical-align: middle; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.container { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 28px; }
.container.narrow { max-width: 760px; }

/* ---------- 상단 ---------- */
#site-header { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--primary); color: #fff; display: grid; place-items: center; }
.logo-text { display: flex; align-items: baseline; gap: 8px; font-size: 20px; font-weight: 900; letter-spacing: -.03em; }
.logo-text small { font-size: 13px; font-weight: 400; letter-spacing: 0; color: var(--sub); }
.nav { display: flex; align-items: center; gap: 2px; }
.nav a { padding: 8px 11px; font-size: 15px; color: var(--ink); border-radius: 6px; }
.nav a:hover { background: var(--soft); }
.nav a.current { font-weight: 700; box-shadow: inset 0 -2px 0 var(--primary); border-radius: 0; }
.nav a.nav-ai { margin-left: 8px; border: 1.5px solid var(--primary); color: var(--primary); font-weight: 700; padding: 7px 14px; border-radius: 6px; box-shadow: none; }
.nav a.nav-ai:hover, .nav a.nav-ai.current { background: var(--primary); color: #fff; }
.menu-btn { display: none; background: none; border: 0; width: 40px; height: 40px; cursor: pointer; }
.menu-btn span { display: block; width: 22px; height: 2px; background: var(--ink); margin: 5px auto; border-radius: 2px; }

/* ---------- 하단 ---------- */
#site-footer { background: var(--paper); border-top: 1px solid var(--line); margin-top: 64px; }
.footer-inner { padding: 24px 28px; display: flex; flex-direction: column; gap: 2px; font-size: 14px; color: var(--sub); }
.footer-inner strong { color: var(--ink); }

/* ---------- 메인: 표지 ---------- */
.cover { background: var(--cover); color: #fff; }
.cover-inner { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: start; }
.cover .cover-inner { padding-top: 44px; padding-bottom: 44px; }
.addr { font-size: 15px; color: var(--cover-sub); }
.cover h1 { font-size: 44px; font-weight: 900; letter-spacing: -.04em; line-height: 1.22; margin: 6px 0 24px; white-space: pre-line; }
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 560px; }
.quick a {
  background: var(--tile); color: #F1F5F7; border-radius: var(--r);
  padding: 14px 4px 11px; display: flex; flex-direction: column; align-items: center; gap: 7px;
  font-size: 13px; font-weight: 700; text-align: center;
}
.quick a:hover { background: #45667A; }

/* 오늘 바다 판 */
.sea { background: var(--paper); color: var(--ink); border-radius: 10px; padding: 22px 24px; }
.sea-head { display: flex; justify-content: space-between; align-items: baseline; }
.sea-head b { font-size: 16px; }
.sea-head span { font-size: 13px; color: var(--sub); }
.sea-status { display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 900; letter-spacing: -.03em; margin: 8px 0 12px; }
.sea-status i { width: 16px; height: 16px; border-radius: 50%; background: #C4CCD2; }
.sea-status.st-good i { background: var(--good); } .sea-status.st-mild i { background: var(--mild); }
.sea-status.st-rough i { background: var(--rough); } .sea-status.st-stop i { background: var(--stop); }
.lv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-bottom: 14px; }
.lv span { font-size: 12px; text-align: center; padding: 5px 2px 0; border-top: 4px solid; color: var(--sub); }
.lv .good { border-color: var(--good); } .lv .mild { border-color: var(--mild); }
.lv .rough { border-color: var(--rough); } .lv .stop { border-color: var(--stop); }
.lv span.on { color: var(--ink); font-weight: 700; }
.vals { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.vals div { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.vals div:nth-child(odd) { padding-right: 14px; }
.vals div:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--line); }
.vals span { color: var(--sub); }
.vals b.empty { color: var(--faint); }
.sea-link { display: inline-block; margin-top: 14px; font-weight: 700; color: var(--primary); font-size: 15px; border-bottom: 1px solid currentColor; }

/* 한눈에 보는 마리나 */
.facts { background: var(--paper); border-bottom: 1px solid var(--line); }
.facts-inner { display: grid; grid-template-columns: repeat(4, 1fr); }
.fact { padding: 20px 20px 20px 0; display: flex; gap: 12px; min-width: 0; }
.fact + .fact { padding-left: 20px; border-left: 1px solid var(--line); }
.fact .icon { color: var(--primary); margin-top: 2px; }
.fact small { display: block; font-size: 13px; color: var(--sub); }
.fact b { display: block; font-size: 15px; }
.fact p { font-size: 13px; color: var(--sub); overflow-wrap: anywhere; }

/* 코스 입력 줄 (메인) */
.course-bar {
  margin-top: 36px; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center;
  background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--primary);
  border-radius: var(--r); padding: 18px 22px;
}
.course-bar label { font-size: 17px; font-weight: 700; white-space: nowrap; }
.course-bar input {
  border: 0; border-bottom: 1.5px solid var(--line); font-size: 16px; padding: 8px 2px;
  color: var(--ink); width: 100%; background: transparent; min-width: 0;
}
.course-bar input:focus { outline: none; border-bottom-color: var(--primary); }

/* 메인: 가는 방법 요약 + 타기 전에 꼭 */
.two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; margin-top: 40px; }
.two > * { min-width: 0; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.panel-head h2 { font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
.panel-head a { font-size: 14px; color: var(--primary); font-weight: 700; white-space: nowrap; }
.tbl { overflow-x: auto; }
.sum-table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 15px; }
.sum-table th { text-align: left; font-size: 13px; font-weight: 500; color: var(--sub); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.sum-table td { padding: 11px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tnote { font-size: 13px; color: var(--sub); margin-top: 10px; }
.check { list-style: none; }
.check li { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.check li:last-child { border-bottom: 0; }
.check .icon { color: var(--primary); margin-top: 4px; }

/* 메인: 주변 관광 */
.near { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.near a { padding: 18px 20px; }
.near a + a { border-left: 1px solid var(--line); }
.near a:hover h3 { text-decoration: underline; }
.near h3 { font-size: 16px; }
.near p { font-size: 14px; color: var(--sub); }
.near small { display: block; margin-top: 8px; font-size: 13px; color: var(--sub); }

/* ---------- 공통: 하위 페이지 제목 ---------- */
.page-head { background: var(--paper); border-bottom: 1px solid var(--line); padding: 40px 0 32px; }
.page-head h1 { font-size: 32px; font-weight: 900; letter-spacing: -.03em; margin-bottom: 4px; }
.page-head p { color: var(--sub); }

/* ---------- 공통: 섹션 ---------- */
.section { padding: 48px 0; }
.pt-0 { padding-top: 0; }
.block { margin-top: 40px; }
.section-title { font-size: 22px; font-weight: 900; letter-spacing: -.03em; margin-bottom: 12px; }
.section-title.sm { font-size: 19px; }
.section-desc { color: var(--sub); margin: -6px 0 16px; }

/* ---------- 공통: 칩 ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-row.small { gap: 6px; }
.chip {
  display: inline-flex; align-items: center; background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 13px; font-size: 14px; cursor: pointer;
}
.chip-lg { padding: 9px 15px; font-size: 15px; }
a.chip:hover, button.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip-row.small .chip { padding: 4px 10px; font-size: 13px; cursor: default; background: var(--soft); border-color: transparent; }
.chip-empty { border-style: dashed !important; color: var(--faint) !important; background: var(--paper) !important; border-color: #C3CDD3 !important; }

/* ---------- 공통: 판·격자 ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; }
.card h3 { font-size: 18px; font-weight: 700; }
.card p { color: var(--sub); }
.card-label { font-size: 14px !important; font-weight: 700; color: var(--sub); }
.muted { color: var(--sub); }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.info-list { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--sub); }
.info-list li { display: flex; align-items: center; gap: 6px; }
.notice-line { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--primary); border-radius: 6px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; color: var(--sub); }
.alert-line { display: flex; gap: 10px; align-items: center; border-left-color: var(--rough); }
.alert-on { border-left-color: var(--stop); color: var(--ink); background: #FBEFEE; }
.alert-off { border-left-color: var(--good); }
.alert-off .icon { color: var(--good); }
.credit[hidden] { display: none; }

/* 준비 중 */
.preparing { background: var(--paper); border: 1px dashed #C3CDD3; border-radius: var(--r); padding: 40px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.preparing-icon { color: var(--faint); margin-bottom: 6px; }
.preparing strong { font-size: 17px; }
.preparing p { color: var(--sub); font-size: 15px; }
.placeholder-text { color: var(--faint) !important; font-size: 14px; }

/* ---------- 공통: 버튼 ---------- */
.btn-orange {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--primary); color: #fff; border: 0; border-radius: 6px;
  padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.btn-orange:hover { background: var(--primary-dark); }
.btn-orange.sm { padding: 8px 14px; font-size: 14px; }
.btn-line { display: inline-flex; align-items: center; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--primary); background: var(--paper); }
.btn-line:hover { border-color: var(--primary); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; }

/* ---------- 요트·체험 ---------- */
.company { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.company + .company { margin-top: 10px; }
.company[open] { border-color: var(--primary); }
.company-sum { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto auto; gap: 20px; align-items: center; padding: 18px 24px; }
.company-sum::-webkit-details-marker { display: none; }
.company-sum:hover { background: var(--bg); }
.company-sum:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.company[open] > .company-sum { border-bottom: 1px solid var(--line); }
.cs-main h3 { font-size: 20px; font-weight: 900; letter-spacing: -.03em; }
.cs-meta { font-size: 14px; color: var(--sub); margin-top: 2px; }
.cs-price { display: grid; gap: 2px; text-align: right; font-size: 14px; color: var(--sub); }
.cs-price b { color: var(--ink); font-size: 16px; font-weight: 900; margin-left: 6px; }
.cs-toggle { font-size: 14px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.cs-toggle::before { content: "자세히 보기"; }
.company[open] .cs-toggle::before { content: "접기"; }
.cs-toggle::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
.company[open] .cs-toggle::after { transform: translateY(2px) rotate(-135deg); }
.company-body { padding: 18px 24px 22px; }
.company-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.company-head .btn-row { margin-left: auto; }
.company-head h3 { font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
.aka { font-size: 14px; color: var(--sub); }
.company-head .btn-row { margin-top: 0; padding-top: 0; }
.company-info { margin: 0 0 18px; padding: 0 0 14px; border-bottom: 1px solid var(--line); gap: 6px; }
.company-head + .company-info { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.company-info li { align-items: flex-start; }
.company-info .icon { margin-top: 3px; }
.company-info b { color: var(--ink); margin-right: 4px; }
.course-group + .course-group { margin-top: 18px; }
.company-hint { font-size: 14px; margin-bottom: 10px; }
.cg-title { font-size: 15px; font-weight: 900; margin-bottom: 6px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cg-title span { font-size: 13px; font-weight: 400; color: var(--sub); }
.course-list { border-top: 2px solid var(--ink); }
.course-row { display: grid; grid-template-columns: 1fr 120px 130px; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.course-row h3 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cr-badge { font-size: 11px; font-weight: 700; color: var(--primary); background: var(--soft); border-radius: 4px; padding: 1px 6px; }
.cr-dur { font-size: 14px; color: var(--sub); display: flex; align-items: center; gap: 5px; }
.course-row .exp-price { font-size: 16px; text-align: right; }
.course-row .exp-note { font-size: 13px; color: var(--sub) !important; margin-top: 2px; }
.schedule { background: var(--bg); border-radius: 6px; padding: 12px 14px; margin-bottom: 18px; font-size: 14px; }
.sch-head { margin-bottom: 6px; color: var(--sub); }
.sch-head b { color: var(--ink); margin-right: 6px; }
.sch-times { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.sch-times li { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 13px; }
.schedule details { margin-top: 10px; }
.schedule summary { cursor: pointer; color: var(--primary); font-weight: 700; font-size: 13px; }
.sch-row { display: grid; grid-template-columns: 80px 1fr; gap: 8px; margin-top: 8px; align-items: start; }
.sch-row > span { font-weight: 700; font-size: 13px; padding-top: 3px; }
.exp-card .chip-row { margin-top: 4px; }
.exp-price { font-size: 20px; font-weight: 900; color: var(--ink) !important; letter-spacing: -.02em; }
.exp-note { font-size: 14px; color: var(--primary) !important; }
.exp-info { margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); gap: 6px; }
.exp-info li { align-items: flex-start; }
.exp-info .icon { margin-top: 3px; }
.exp-info b { color: var(--ink); font-weight: 700; margin-right: 4px; }
.facility-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.fee-tag { flex-shrink: 0; font-size: 12px; font-weight: 700; background: var(--soft); color: var(--primary); border-radius: 4px; padding: 2px 8px; margin-top: 3px; }
.facility-card .info-list { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
.soon-card h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.soon-card .icon { color: var(--primary); }
.tag-soon { font-size: 12px; font-weight: 700; color: var(--sub); background: var(--soft); border-radius: 4px; padding: 2px 8px; }

/* ---------- 가는 방법 ---------- */
.transport-card { gap: 10px; }
.mode-title { display: flex; align-items: center; gap: 6px; font-weight: 700; margin-top: 6px; }
.mode-title .muted { font-weight: 400; font-size: 14px; }
.bus-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.bus-table th { text-align: left; font-size: 12px; font-weight: 500; color: var(--sub); padding: 4px 6px; border-bottom: 1px solid var(--line); }
.bus-table td { padding: 7px 6px; border-bottom: 1px solid var(--soft); }
.bus-no { display: inline-block; min-width: 48px; text-align: center; background: var(--primary); color: #fff; font-weight: 700; border-radius: 4px; padding: 1px 7px; font-size: 13px; }
.mode-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: var(--bg); border-radius: 6px; font-size: 14px; }
.mode-row .muted { margin-left: auto; }

/* ---------- 주변 관광 ---------- */
.move-info { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--sub); }
.move-info b { color: var(--primary); margin-left: auto; }

/* ---------- 안전 가이드 ---------- */

/* ---------- 안전 가이드 (단계 + 표지판) ---------- */
.sg-steps { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); overflow: hidden; }
.sg-step { display: flex; gap: 10px; align-items: center; padding: 14px 16px; text-align: left; font: inherit; color: var(--sub); background: none; border: 0; border-right: 1px solid var(--line); cursor: pointer; }
.sg-step:last-child { border-right: 0; }
.sg-step:hover { background: var(--bg); }
.sg-step:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.sg-step[aria-pressed="true"] { background: var(--primary); color: #fff; }

// 출발지마다 가장 자주 오는 버스 한 줄
function transportSummary() {
  if (isEmpty(D.transport)) return preparing("이동 안내 준비 중입니다");
  const freq = b => Number(String(b.freq || "").replace(/[^0-9]/g, "")) || 0;
  const rows = D.transport.map(t => {
    const opts = t.options || [];
    const bus = opts.filter(o => o.type === "bus").sort((x, y) => freq(y) - freq(x))[0];
    const taxi = opts.find(o => o.type === "taxi"), walk = opts.find(o => o.type === "walk");
    const from = t.from.replace(/^강릉\s+/, "") + (t.board ? ` (${t.board.replace(/\s*정류장$/, "")})` : "");
    return `<tr><td>${esc(from)}</td>
      <td>${bus ? `<span class="bus-no">${esc(bus.no)}</span> ${esc(bus.time || "")}` : "--"}</td>
      <td>${taxi ? esc([taxi.time, taxi.fare].filter(Boolean).join(", ")) : "--"}</td>
      <td>${walk ? esc(walk.time || "") : "--"}</td></tr>`;
  }).join("");
  const first = D.transport[0];
  const note = [first.stop ? `버스는 ${first.stop} 정류장에서 내려요.` : "", first.busFare ? `요금 ${first.busFare}, 평일 기준이에요.` : ""].join(" ");
  return `
    <div class="tbl"><table class="sum-table">
      <thead><tr><th>출발지</th><th>자주 오는 버스</th><th>택시</th><th>도보</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="tnote">${esc(note)}</p>`;
}

// 체험 목록 그리기 (선택한 조건으로 거르고, 같은 업체끼리 묶기)
function renderExperiences(selected) {
  if (isEmpty(D.experiences)) return preparing("체험 정보 준비 중입니다", "강릉 마리나 체험 정보를 모으고 있어요.");
  const groups = expGroups(selected);
  if (groups.length === 0) return preparing("조건에 맞는 체험이 없어요", "다른 조건을 골라 보세요.");
  window.__expSel = selected;
  const keep = groups.find(g => g.id === window.__expCompany);
  const cur = keep || groups[0];
  window.__expCompany = cur.id;
  return `
    <div class="exp-cards">
      <p class="muted company-hint">업체 카드를 누르면 아래에 코스가 나와요.</p>
      <div class="cc-grid">${groups.map(g => companyCard(g, g.id === cur.id, selected.length > 0)).join("")}</div>
      <div class="cd" id="exp-detail">${companyDetail(cur)}</div>
    </div>`;
}

// 조건에 맞는 코스를 업체별로 묶기 (업체 순서 = companies 순서)
function expGroups(selected) {
  const list = selected.length
    ? D.experiences.filter(e => selected.every(s => (e.tags || []).includes(s)))
    : D.experiences;
  const order = id => { const i = (D.companies || []).findIndex(c => c.id === id); return i < 0 ? 99 : i; };
  const groups = [];
  list.forEach(e => {
    let g = groups.find(x => x.id === e.company);
    if (!g) groups.push(g = { id: e.company, c: (D.companies || []).find(c => c.id === e.company), items: [] });
    g.items.push(e);
  });
  return groups.sort((a, b) => order(a.id) - order(b.id));
}

// 이름 끝 글자에 받침이 있으면 "이라고도", 없으면 "라고도"
function rago(word) {
  const code = String(word || "").trim().slice(-1).charCodeAt(0) - 0xAC00;
  return (code >= 0 && code <= 11171 && code % 28 !== 0) ? "이라고도" : "라고도";
}

// 업체 묶음: 공통 정보 한 번 + 코스 표 (퍼블릭 / 프라이빗 / 특별 패키지)
const COURSE_TYPES = [
  { key: "public",  label: "퍼블릭", desc: "다른 손님과 함께 타요" },
  { key: "private", label: "프라이빗", desc: "우리 일행만 타요 (요금은 전세 기준)" },
  { key: "special", label: "특별 패키지", desc: "" }
];
function scheduleBox(c) {
  if (isEmpty(c.schedule)) return "";
  const m = new Date().getMonth() + 1;
  const now = c.schedule.find(s => (s.months || []).includes(m));
  const list = s => `<ul class="sch-times">${s.times.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
  return `
    <div class="schedule">
      <p class="sch-head"><b>운항 시간</b>${now ? ` 이번 달(${esc(now.label)})` : ""}</p>
      ${now ? list(now) : ""}
      <details>
        <summary>다른 달 운항 시간 보기</summary>
        ${c.schedule.map(s => `<div class="sch-row"><span>${esc(s.label)}</span>${list(s)}</div>`).join("")}
      </details>
    </div>`;
}

// 가격 글자에서 가장 싼 값 찾기 ("1인 30,000원" → 30000)
function minPrice(items) {
  let best = null;
  items.forEach(e => {
    const m = String(e.price || "").match(/([\d,]+)\s*원/);
    if (!m) return;
    const n = Number(m[1].replace(/,/g, ""));
    if (n && (!best || n < best.n)) best = { n, per: /1인/.test(e.price) };
  });
  return best ? `${best.per ? "1인 " : ""}${best.n.toLocaleString("ko-KR")}원부터` : "";
}

// 업체 특징 (코스 태그에서 모아요)
function companyFeatures(items) {
  const has = t => items.some(e => (e.tags || []).includes(t));
  const f = [];
  if (has("오전")) f.push("오전 코스");
  if (has("노을 시간대")) f.push("노을 코스");
  if (has("반려동물 동반")) f.push("반려동물 가능");
  if (items.some(e => e.type === "special")) f.push("특별 패키지");
  return f;
}

// 업체 카드: 이름·코스 수·특징·최저가
function companyCard(g, on, filtered) {
  const c = g.c || { id: g.id, name: g.id };
  const prices = COURSE_TYPES.filter(t => t.key !== "special").map(t => {
    const v = minPrice(g.items.filter(e => e.type === t.key));
    return v ? `<span>${esc(t.label)}<b>${esc(v)}</b></span>` : "";
  }).join("");
  const feats = companyFeatures(g.items).map(f => `<span>${esc(f)}</span>`).join("");
  return `
    <button type="button" class="cc" data-company="${esc(g.id)}" aria-pressed="${on}">
      <div>
        <h3>${esc(c.name)}</h3>
        <p class="cnt">${filtered ? "조건에 맞는 코스" : "코스"} ${g.items.length}개${c.capacity ? `<span class="cc-cap">, ${esc(c.capacity)}</span>` : ""}</p>
      </div>
      ${feats ? `<div class="cc-feat">${feats}</div>` : ""}
      ${prices ? `<div class="cc-price">${prices}</div>` : ""}
      <span class="cc-more">${on ? "코스 보는 중" : "코스 보기"}</span>
    </button>`;
}

// 고른 업체의 안내 + 코스 승선권
function companyDetail(g) {
  const c = g.c || { name: g.id };
  const row = (ic, label, v) => v ? `<li>${icon(ic, 16)}<span><b>${label}</b> ${esc(v)}</span></li>` : "";
  const links = (c.links || []).filter(l => /^https:\/\//.test(l.url || ""))
    .map(l => `<a class="btn-line" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
  const groups = COURSE_TYPES.map(t => ({ t, list: g.items.filter(e => e.type === t.key) }))
    .concat([{ t: { label: "기타", desc: "" }, list: g.items.filter(e => !COURSE_TYPES.some(t => t.key === e.type)) }])
    .filter(x => x.list.length);
  return `
    <div class="cd-head">
      <h3>${esc(c.name)}</h3>
      ${links ? `<div class="btn-row">${links}</div>` : ""}
    </div>
    ${(c.aka || []).length ? `<p class="aka">${esc(c.aka.join(", "))}${rago(c.aka[c.aka.length - 1])} 불러요</p>` : ""}
    <ul class="info-list company-info">
      ${row("pin", "출발", c.place)}${row("toilet", "인원", c.capacity)}
      ${row("calendar", "예약", c.reserve)}${row("alert", "취소", c.refund)}
    </ul>
    ${scheduleBox(c)}

/* ----- 날씨 쉬운 말 도우미 ----- */
const toNum = v => (v === "" || v == null || isNaN(Number(v))) ? NaN : Number(v);
function easyText(kind, value) {
  const list = (D.easy || {})[kind];
  const v = toNum(value);
  if (!list || isNaN(v)) return "";
  const hit = list.find(l => l.under === undefined || v < l.under);
  return hit ? hit.text : "";
}
// 바람·파고·특보로 그날 상태 고르기 (값이 하나도 없으면 null)
function dayStatus(wind, wave, alert) {
  const w = toNum(wind), h = toNum(wave);
  const a = String(alert || "");
  const storm = /풍랑/.test(a);
  if (isNaN(w) && isNaN(h) && !storm) return null;
  for (const d of D.easy.day) {
    if (d.key === "good") return d;
    if ((d.key === "stop" && storm) || (!isNaN(w) && w >= d.wind) || (!isNaN(h) && h >= d.wave)) return d;
  }
  return null;
}
function currentValue(id) { const w = (D.live.weather || []).find(x => x.id === id); return w ? w.value : ""; }
function currentStatus() { return dayStatus(currentValue("wind"), currentValue("wave"), currentValue("alert")); }
function dayBadge(st, short = false) {
  return st
    ? `<span class="day-badge day-${st.key}">${esc(short ? st.short : st.text)}</span>`
    : `<span class="day-badge day-none">${short ? "--" : "상태 확인 중"}</span>`;
}

/* ----- 날짜 도우미 ----- */
const WEEKDAY = ["일", "월", "화", "수", "목", "금", "토"];
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function findDay(list, d) { return (list || []).find(x => x.date === dateKey(d)) || {}; }
const show = (v, unit = "") => (toNum(v) === toNum(v)) ? esc(v + unit) : "--";

/* ----- 표지(휴대폰)용 날씨 한 줄 요약 ----- */
function liveSummary() {
  const part = (label, id, unit) => {
    const v = currentValue(id), e = easyText(id, v);
    return `<span>${label} <b>${show(v, unit)}</b>${e ? ` <em>${esc(e)}</em>` : ""}</span>`;
  };
  return `
    <a class="live-summary" href="#/live">
      <div class="ls-top"><b>오늘 바다</b>${dayBadge(currentStatus())}<span class="ls-more">자세히 보기</span></div>
      <div class="ls-line">${part("기온", "temp", "℃")}${part("바람", "wind", "m/s")}${part("파고", "wave", "m")}<span>일몰 <b>${esc(D.live.sunset || "--:--")}</b></span></div>
    </a>`;
}

/* ----- 이번 주 날씨 (오늘부터 7일) ----- */
function weekView() {
  const today = new Date();
  const n = Math.min(7, forecastDays());
  if (!n) return preparing("날씨 예보를 불러오고 있어요", "예보가 들어오면 날짜별로 보여 드려요.");
  const cards = Array.from({ length: n }, (_, i) => i).map(i => {
    const d = addDays(today, i), f = findDay(D.live.week, d);
    const label = i === 0 ? "오늘" : i === 1 ? "내일" : WEEKDAY[d.getDay()] + "요일";
    return `
      <div class="week-card ${i === 0 ? "today" : ""}">
        <div class="wk-day"><b>${label}</b><span>${d.getMonth() + 1}/${d.getDate()}</span></div>
        <div class="wk-sky">${esc(f.sky || "--")}</div>
        <div class="wk-temp"><b>${show(f.tmax, "°")}</b> / ${show(f.tmin, "°")}</div>
        <ul class="wk-info">
          <li>${icon("wind", 14)} ${show(f.wind, "m/s")}</li>
          <li>${icon("wave", 14)} ${show(f.wave, "m")}</li>
        </ul>
        ${dayBadge(dayStatus(f.wind, f.wave, f.alert), true)}
      </div>`;
  }).join("");
  return `<div class="week-row">${cards}</div>`;
}

/* ----- 앞으로 날씨 (달력 모양, 예보가 있는 날짜까지만) ----- */
function hasForecast(f) {
  return ["sky", "tmax", "tmin", "wind", "wave"].some(k => f[k] !== undefined && f[k] !== null && f[k] !== "");
}
// 오늘부터 예보가 있는 마지막 날까지의 날짜 수 (예보가 없으면 0)
function forecastDays() {
  const today = new Date();
  let last = -1;
  for (let i = 0; i < 31; i++) if (hasForecast(findDay(D.live.month, addDays(today, i)))) last = i;
  return last + 1;
}
function monthView() {
  const n = forecastDays();
  if (!n) return preparing("날씨 예보를 불러오고 있어요", "예보가 들어오면 날짜별로 보여 드려요.");
  const today = new Date();
  const lead = today.getDay();   // 오늘 앞의 빈칸 (일요일 시작)
  const head = WEEKDAY.map((w, i) => `<div class="cal-head ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</div>`).join("");
  const blanks = Array.from({ length: lead }, () => `<div class="cal-cell blank"></div>`).join("");
  const cells = Array.from({ length: n }, (_, i) => {
    const d = addDays(today, i), f = findDay(D.live.month, d);
    const st = dayStatus(f.wind, f.wave, f.alert);
    const label = (i === 0 || d.getDate() === 1) ? `${d.getMonth() + 1}/${d.getDate()}` : d.getDate();
    return `
      <div class="cal-cell ${i === 0 ? "today" : ""} ${st ? "st-" + st.key : ""}">
        <span class="cal-date ${d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : ""}">${label}</span>
        ${f.sky ? `<span class="cal-sky">${esc(f.sky)}</span>` : ""}
        ${st ? `<span class="cal-st">${esc(st.short)}</span>` : ""}
        <span class="cal-temp">${show(f.tmax, "°")}/${show(f.tmin, "°")}</span>
      </div>`;
  }).join("");
  return `<div class="cal">${head}${blanks}${cells}</div>`;
}

/* ----- 쉬운 말 기준표 (수치와 함께) ----- */
function easyLegend() {
  const range = (list, unit) => list.map((l, i) => {
    const from = i === 0 ? null : list[i - 1].under;
    const txt = l.under === undefined ? `${from}${unit} 이상` : from == null ? `${l.under}${unit} 미만` : `${from}~${l.under}${unit}`;
    return `<li><b>${esc(l.text)}</b> ${esc(txt)}</li>`;
  }).join("");
  const days = D.easy.day.map(d => `<li>${dayBadge(d)} <span>${esc(d.rule)}</span></li>`).join("");
  return `
    <div class="grid-2 legend">
      <div class="card"><h3>오늘 상태 배지</h3><ul class="legend-days">${days}</ul></div>
      <div class="card"><h3>수치 쉬운 말</h3>
        <div class="legend-scale"><span>바람</span><ul>${range(D.easy.wind, "m/s")}</ul></div>
        <div class="legend-scale"><span>파고</span><ul>${range(D.easy.wave, "m")}</ul></div>
        <div class="legend-scale"><span>기온</span><ul>${range(D.easy.temp, "℃")}</ul></div>
        <div class="legend-scale"><span>수온</span><ul>${range(D.easy.water, "℃")}</ul></div>
      </div>
    </div>`;
}

// 실시간 정보 맨 위 특보 안내
function alertBanner() {
  const a = String(currentValue("alert") || "").trim();
  if (/풍랑/.test(a)) return `<div class="notice-line alert-line alert-on">${icon("alert", 18)} 지금 강릉 앞바다에 ${esc(a)}가 발효 중이에요. 요트 운항이 취소될 수 있으니 업체에 꼭 확인해 주세요.</div>`;
  if (a) return `<div class="notice-line alert-line alert-off">${icon("check", 18)} 지금 강릉 앞바다에 풍랑특보가 없어요.</div>`;
  return `<div class="notice-line alert-line">${icon("alert", 18)} 기상특보 정보를 준비하고 있어요. 풍랑주의보가 내려지면 운항이 취소돼요.</div>`;
}

function pageLive() {
  return `
    ${pageHead("LIVE", "실시간 정보", "지금 마리나 바다 상황을 영상과 날씨로 확인하세요.")}
    <section class="section"><div class="container">
      ${alertBanner()}
      ${liveBlock()}

      <h2 class="section-title mt-48">이번 주 날씨</h2>
      <p class="section-desc">오늘부터 7일 동안의 바다 날씨예요.</p>
      ${weekView()}

      <h2 class="section-title mt-48">${forecastDays() ? `앞으로 ${forecastDays()}일 날씨` : "앞으로 날씨"}</h2>
      <p class="section-desc">기상청 예보가 있는 날짜까지만 보여 드려요. 먼 날짜일수록 예보가 바뀔 수 있어요.</p>
      ${monthView()}

      <h2 class="section-title mt-48">날씨 쉬운 말 기준</h2>
      <p class="section-desc">수치 옆의 쉬운 말과 오늘 상태 배지는 아래 기준으로 정해져요. 실제 운항 여부는 업체에 확인해 주세요.</p>
      ${easyLegend()}
    </div></section>`;
}

/* ---------- 없는 주소 ---------- */
function pageNotFound() {
  return `<section class="section"><div class="container narrow">
    ${preparing("준비 중인 페이지입니다", "메뉴에서 다른 페이지를 선택해 주세요.")}
  </div></section>`;
}

/* =====================================================================
   공통 상단/하단
   ===================================================================== */
function renderHeader() {
  const links = MENU.map(m =>
    `<a href="${m.path}" class="${m.highlight ? "nav-ai" : ""}" data-nav="${m.path}">${m.label}</a>`).join("");
  document.getElementById("site-header").innerHTML = `
    <div class="container header-inner">
      <a href="#/" class="logo">
        <span class="logo-mark">${icon("boat", 22)}</span>
        <span class="logo-text">${esc(D.site.name)}<small>${esc(D.site.subtitle)}</small></span>
      </a>
      <button class="menu-btn" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav">${links}</nav>
    </div>`;

  const btn = document.querySelector(".menu-btn");
  const nav = document.querySelector(".nav");
  btn.addEventListener("click", () => {
    const open = nav.classList.toggle("open");
    btn.setAttribute("aria-expanded", open);
  });
}

function renderFooter() {
  document.getElementById("site-footer").innerHTML = `
    <div class="container footer-inner">
      <strong>${esc(D.site.name)}</strong>
      <p>${esc(D.site.notice)}</p>
      <p>문의 ${esc(D.site.contact)}</p>
      <p class="credit" ${D.live.source ? "" : "hidden"}>날씨 정보: ${esc(D.live.source || "")} 제공</p>
    </div>`;
}

/* =====================================================================
   주소(#/...)에 따라 페이지 바꾸기
   ===================================================================== */
function router() {
  try { routerInner(); } catch (err) {
    console.error(err);
    document.getElementById("app").innerHTML = pageNotFound();
  }
}
function routerInner() {
  const hash = location.hash || "#/";
  const [pathPart, queryPart] = hash.slice(1).split("?");
  const parts = pathPart.split("/").filter(Boolean);   // 예: ["category", "pet"]
  const params = new URLSearchParams(queryPart || "");

  let html;
  switch (parts[0]) {
    case undefined:   html = pageHome(); break;
    case "result":    html = pageResult(params); break;
    case "ai":        html = pageAI(); break;
    case "category":  html = pageCategory(parts[1]); break;
    case "marina":    html = pageMarina(); break;
    case "yacht":     html = pageYacht(); break;
    case "booking":   html = pageBooking(); break;
    case "transport": html = pageTransport(); break;
    case "tour":      html = pageTour(); break;
    case "safety":    html = pageSafety(parts[1]); break;
    case "live":      html = pageLive(); break;
    default:          html = pageNotFound();
  }
  document.getElementById("app").innerHTML = html;

  // 현재 메뉴 표시
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.classList.toggle("current", hash.startsWith(a.dataset.nav)));
  document.querySelector(".nav")?.classList.remove("open");

  // 안전 가이드 특정 항목으로 왔으면 그 위치로, 아니면 맨 위로
  const focus = parts[0] === "safety" && parts[1] && document.getElementById("safety-tiles");
  if (focus) focus.scrollIntoView({ behavior: "smooth", block: "center" });
  else if (!window.__keepScroll) window.scrollTo(0, 0);
}

/* ---------- 클릭·입력 처리 ---------- */
document.addEventListener("submit", e => {
  const form = e.target.closest("[data-ai-form]");
  if (!form) return;
  e.preventDefault();
  const text = form.q.value.trim() || form.q.placeholder;
  location.hash = "#/result?q=" + encodeURIComponent(text);
});

document.addEventListener("click", e => {
  // 예시 문장 누르면 입력창에 채우기
  const ex = e.target.closest("[data-example]");
  if (ex) {
    const box = document.getElementById("ai-input");
    box.value = ex.dataset.example;
    box.focus();
    return;
  }
  // CCTV 탭 바꾸기
  const tab = e.target.closest(".cam-tab");
  if (tab) {
    const card = tab.closest(".live-cctv");
    card.querySelectorAll(".cam-tab").forEach(t => {
      const on = t === tab;
      t.classList.toggle("on", on);
      t.setAttribute("aria-selected", on);
    });
    card.querySelector(".cam-view").innerHTML = cameraView(D.live.cameras[Number(tab.dataset.cam)]);
    return;
  }
  // 카테고리 항목 고르기 (여러 개 선택 가능)
  const opt = e.target.closest(".option");
  if (opt) {
    const on = opt.getAttribute("aria-pressed") !== "true";
    opt.setAttribute("aria-pressed", on);
    opt.classList.toggle("active", on);
    const selected = [...document.querySelectorAll(".option.active")].map(b => b.dataset.option);
    document.getElementById("category-result").innerHTML = renderExperiences(selected);
  }
});

window.addEventListener("hashchange", router);

/* ---------- 날씨 불러오기 (weather.json) ----------
   GitHub Actions가 저장한 파일을 읽어 정보 영역의 live 칸을 채워요.
   못 불러오면 조용히 넘어가고 지금처럼 '--'로 보여요. */
async function loadWeather() {
  const urls = [D.live.weatherUrl, "weather.json"].filter(Boolean);
  for (const u of urls) {
    try {
      const res = await fetch(u + (u.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) continue;
      const w = await res.json();
      if (!w || !w.current) continue;
      applyWeather(w);
      return true;
    } catch (e) { /* 다음 주소로 */ }
  }
  return false;
}

function applyWeather(w) {
  const L = D.live;
  const map = { temp: "temp", wind: "wind", wave: "wave", water: "water", alert: "alert" };
  (L.weather || []).forEach(x => {
    const v = w.current[map[x.id]];
    x.value = (v === null || v === undefined) ? "" : String(v);
  });
  if (w.sunset) L.sunset = w.sunset;
  if (w.updated) L.updated = w.updated;
  if (Array.isArray(w.days)) { L.week = w.days; L.month = w.days; }
  L.source = w.source || "기상청";
  // 날씨가 보이는 화면이면 다시 그리기 (스크롤 위치는 그대로)
  const h = location.hash || "#/";
  if (h === "#/" || h === "#" || h.startsWith("#/live")) {
    window.__keepScroll = true;   // 날씨만 바뀐 거라 스크롤은 그대로
    router();
    window.__keepScroll = false;
  }
  renderFooter();
}
renderHeader();
// 업체 카드 누르면 아래 코스만 바꿔 그리기 (화면 위치 그대로, 휴대폰은 코스 위치로 이동)
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".cc");
  if (!b) return;
  const wrap = b.closest(".exp-cards");
  const g = expGroups(window.__expSel || []).find(x => x.id === b.dataset.company);
  if (!wrap || !g) return;
  window.__expCompany = g.id;
  wrap.querySelectorAll(".cc").forEach(x => {
    const on = x === b;
    x.setAttribute("aria-pressed", String(on));
    const more = x.querySelector(".cc-more");
    if (more) more.textContent = on ? "코스 보는 중" : "코스 보기";
  });
  const d = wrap.querySelector("#exp-detail");
  d.innerHTML = companyDetail(g);
  if (window.innerWidth <= 640) d.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
});

// 안전 가이드 단계 버튼: 표지판만 바꿔 그리기 (화면 위치 그대로)
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest(".sg-step");
  if (!b) return;
  const step = D.safety.find(s => s.id === b.dataset.step);
  document.querySelectorAll(".sg-step").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  const box = document.getElementById("safety-tiles");
  if (box) box.innerHTML = safetyTiles(step);
  history.replaceState(null, "", "#/safety/" + b.dataset.step);
});

renderFooter();
router();
loadWeather();
setInterval(loadWeather, 30 * 60 * 1000);   // 30분마다 다시 확인

  </script>
</body>
</html>
