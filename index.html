<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요트핏 | 강릉 마리나 가이드</title>
  <meta name="site-version" content="v4">
  <!-- 사이트 버전 v4 (2026-11-21) -->

  <meta name="description" content="강릉 마리나의 체험, 가는 방법, 주변 관광, 안전 수칙을 한곳에서 확인하고 AI로 방문 코스를 추천받으세요.">
  <!--
    ★ 요트핏 웹사이트 — 이 파일 하나만 있으면 사이트가 작동합니다.
    ★ 내용(요금, 업체, 장소 등)을 고칠 때는 아래 "정보 영역" (window.SITE_DATA) 부분만 고치세요.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   요트핏 디자인 파일 (style.css)
   색을 바꾸고 싶으면 맨 위 :root 의 색 코드만 바꾸면 전체가 바뀝니다.
   ===================================================================== */
:root {
  --navy: #0B2A3F;        /* 진한 남색: 히어로, 강조 박스 */
  --bg: #F4F8FA;          /* 연한 하늘색 배경 */
  --card: #FFFFFF;        /* 카드 */
  --line: #DDE8EC;        /* 카드 테두리 */
  --chip-bg: #E3F1F4;     /* 칩 배경 */
  --chip-text: #0B4A5A;   /* 칩 글자 */
  --sub: #3C6270;         /* 보조 글자 */
  --orange: #F5A25D;      /* 주황 버튼·강조 */
  --text: #0B2A3F;
  --radius: 18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Noto Sans KR", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  word-break: keep-all;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
main { flex: 1; }
a { color: inherit; text-decoration: none; }
button, textarea { font-family: inherit; }
.icon { flex-shrink: 0; vertical-align: middle; }

.container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.container.narrow { max-width: 760px; }

/* ---------- 상단 ---------- */
#site-header {
  background: #fff;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
}
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--navy); color: var(--orange);
  display: grid; place-items: center;
}
.logo-text { font-weight: 900; font-size: 20px; line-height: 1.1; display: flex; flex-direction: column; }
.logo-text small { font-size: 11px; font-weight: 500; color: var(--sub); letter-spacing: .02em; }

.nav { display: flex; gap: 4px; align-items: center; }
.nav a {
  padding: 8px 12px; border-radius: 10px;
  font-size: 15px; font-weight: 500; color: var(--sub);
  transition: background .15s, color .15s;
}
.nav a:hover { background: var(--bg); color: var(--navy); }
.nav a.current { color: var(--navy); font-weight: 700; }
.nav a.nav-ai { background: var(--navy); color: #fff; margin-left: 6px; }
.nav a.nav-ai:hover, .nav a.nav-ai.current { background: #143D58; color: #fff; }

.menu-btn { display: none; background: none; border: 0; width: 40px; height: 40px; cursor: pointer; }
.menu-btn span { display: block; width: 22px; height: 2px; background: var(--navy); margin: 5px auto; border-radius: 2px; }

/* ---------- 하단 ---------- */
#site-footer { background: #fff; border-top: 1px solid var(--line); margin-top: 64px; }
.footer-inner { padding: 28px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.footer-inner p { color: var(--sub); font-size: 14px; }

/* ---------- 히어로 ---------- */
.hero { background: var(--navy); color: #fff; padding: 72px 0; }
.hero-inner { display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px; align-items: center; }
.eyebrow { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .16em; color: var(--sub); margin-bottom: 12px; }
.eyebrow.light { color: var(--orange); }
.hero h1 { font-size: 44px; font-weight: 900; line-height: 1.3; margin-bottom: 20px; }
.hero p { font-size: 17px; color: #C7D6DE; }

/* AI 입력 카드 */
.ai-card {
  background: #fff; color: var(--text);
  border-radius: 20px; padding: 28px;
  box-shadow: 0 20px 40px rgba(0,0,0,.18);
  display: flex; flex-direction: column; gap: 14px;
}
.ai-card-wide { box-shadow: none; border: 1px solid var(--line); }
.ai-card-title { font-size: 18px; font-weight: 700; }
.ai-card textarea {
  width: 100%; resize: vertical; min-height: 110px;
  border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; font-size: 16px; line-height: 1.6;
  background: var(--bg); color: var(--text);
}
.ai-card textarea:focus { outline: 2px solid var(--orange); outline-offset: 1px; background: #fff; }

/* ---------- 버튼 ---------- */
.btn-orange {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--orange); color: var(--navy);
  border: 0; border-radius: 14px; padding: 15px 22px;
  font-size: 17px; font-weight: 700; cursor: pointer;
  transition: filter .15s, transform .15s;
}
.btn-orange:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn-orange.sm { padding: 9px 14px; font-size: 14px; border-radius: 10px; }
.btn-line {
  display: inline-flex; align-items: center; padding: 9px 14px;
  border: 1px solid var(--line); border-radius: 10px;
  font-size: 14px; font-weight: 500; color: var(--chip-text); background: #fff;
}
.btn-line:hover { border-color: var(--chip-text); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 12px; }

/* ---------- 섹션 ---------- */
.section { padding: 56px 0; }
.pt-0 { padding-top: 0; }
.section-title { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.section-title.sm { font-size: 20px; }
.section-desc { color: var(--sub); margin-bottom: 20px; }
.section-title + .chip-row, .section-title + .grid-3, .section-title + .preparing { margin-top: 16px; }

/* 하위 페이지 제목 영역 */
.page-head { background: #fff; border-bottom: 1px solid var(--line); padding: 44px 0 36px; }
.page-head .eyebrow { color: var(--orange); }
.page-head h1 { font-size: 32px; font-weight: 900; margin-bottom: 6px; }
.page-head p { color: var(--sub); }

/* ---------- 칩 ---------- */
.chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
.chip-row.small { gap: 6px; }
.chip {
  display: inline-flex; align-items: center;
  background: var(--chip-bg); color: var(--chip-text);
  border: 1px solid transparent; border-radius: 999px;
  padding: 7px 14px; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: background .15s, border-color .15s;
}
.chip-row.small .chip { padding: 5px 11px; font-size: 13px; cursor: default; }
.chip-lg { padding: 12px 22px; font-size: 16px; }
a.chip:hover, button.chip:hover { border-color: var(--chip-text); }
.chip.active { background: var(--navy); color: #fff; }
.chip-empty { background: #fff; border: 1px dashed #A9C4CC; color: var(--sub); }

/* ---------- 카드 ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 24px;
  display: flex; flex-direction: column; gap: 8px;
}
a.card { transition: transform .15s, box-shadow .15s, border-color .15s; }
a.card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(11,42,63,.08); border-color: #BCD3DA; }
.card h3 { font-size: 19px; font-weight: 700; }
.card p { color: var(--sub); }
.card-icon {
  width: 48px; height: 48px; border-radius: 14px;
  background: var(--chip-bg); color: var(--chip-text);
  display: grid; place-items: center; margin-bottom: 6px;
}
.card-label { font-size: 14px !important; font-weight: 700; color: var(--sub); margin-bottom: 4px; }
.more { margin-top: 8px; font-size: 14px; font-weight: 700; color: var(--chip-text); }
.muted { color: var(--sub); }

.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

/* 주변 관광 카드의 이동 정보 */
.move-info {
  margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--line);
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  font-size: 13px; color: var(--sub);
}
.move-info b { color: var(--chip-text); margin-left: auto; }
.tour-card p { font-size: 15px; }

/* 체험 카드 */
.info-list { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--sub); }
.info-list li { display: flex; align-items: center; gap: 6px; }

/* 준비 중 카드 */
.soon-card h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag-soon {
  font-size: 12px; font-weight: 700; color: var(--navy);
  background: #FDE7D3; border-radius: 999px; padding: 3px 10px;
}

/* ---------- 준비 중 상자 ---------- */
.preparing {
  background: #fff; border: 1px dashed #B8CFD6; border-radius: var(--radius);
  padding: 44px 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.preparing-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: #FDE7D3; color: #C26A1F;
  display: grid; place-items: center; margin-bottom: 6px;
}
.preparing strong { font-size: 18px; }
.preparing p { color: var(--sub); font-size: 15px; }
.placeholder-text { color: #7E9AA4 !important; font-size: 14px; }

/* ---------- AI 결과 페이지 ---------- */
.result-grid { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
.result-side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 92px; }
.quote { font-size: 16px; color: var(--text) !important; background: var(--bg); border-radius: 12px; padding: 14px 16px; }
.text-link { font-size: 14px; font-weight: 700; color: var(--chip-text); }
.note { font-size: 13px; margin-top: 6px; }
.result-main { display: flex; flex-direction: column; gap: 14px; }
.course-title { font-size: 28px; font-weight: 900; }
.mb-16 { margin-bottom: 4px; }

.step-card { flex-direction: row; gap: 18px; align-items: flex-start; }
.step-card.best { border: 2px solid var(--orange); box-shadow: 0 10px 24px rgba(245,162,93,.15); }
.step-num {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--chip-bg); color: var(--chip-text);
  display: grid; place-items: center; font-weight: 900; font-size: 18px;
}
.step-card.best .step-num { background: var(--orange); color: var(--navy); }
.step-body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.step-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { background: var(--orange); color: var(--navy); font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }

.navy-box {
  background: var(--navy); color: #fff; border-radius: var(--radius);
  padding: 22px 24px; display: flex; flex-direction: column; gap: 8px;
}
.navy-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: #9FB6C2; }
.navy-links a { color: var(--orange); font-weight: 700; }
.navy-links a:hover { text-decoration: underline; }
.disclaimer { font-size: 13px; color: var(--sub); }

/* AI 입력 페이지 예시 문장 */
.examples { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.example {
  text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 18px; font-size: 15px; color: var(--sub); cursor: pointer;
}
.example:hover { border-color: var(--orange); color: var(--navy); }

/* 안전 가이드 */
.safety-card.focus { border: 2px solid var(--orange); }
.check-list { padding-left: 20px; color: var(--text); }

/* 실시간 정보 (표지 겹침 영역 + 실시간 정보 페이지) */
.hero.hero-live { padding-bottom: 120px; }
.live-cover { margin-top: -72px; position: relative; }
.live-more { text-align: right; margin-top: 12px; }
.live-more a, .live-more a:visited { font-size: 14px; font-weight: 700; color: var(--chip-text); }
.live-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; align-items: start; }
.live-cover .card { box-shadow: 0 16px 36px rgba(11,42,63,.10); }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.cam-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.cam-tab {
  font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  padding: 6px 12px; border-radius: 999px; border: 0;
  background: var(--chip-bg); color: var(--chip-text);
}
.cam-tab.on { background: var(--navy); color: #fff; }
.cctv {
  position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
  background: linear-gradient(160deg, #123a55, #0B2A3F 60%, #08202f); color: #9FB6C2;
}
.cctv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.cctv-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
.cctv-tl { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
.cctv-tag { background: rgba(255,255,255,.12); color: #fff; font-size: 12px; border-radius: 6px; padding: 3px 8px; }
.cctv-br { position: absolute; bottom: 12px; right: 12px; font-size: 12px; color: #7f9aa8; }
.live-dot {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
  color: #C26A1F; background: #FDE7D3; border-radius: 999px; padding: 3px 10px;
}
.live-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #E0802F; }
.updated { font-size: 12px; color: #7E9AA4; }
.wx-list { display: flex; flex-direction: column; }
.wx-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 2px; border-bottom: 1px solid #EEF4F6; font-size: 15px; }
.wx-row span { color: var(--sub); display: flex; gap: 8px; align-items: center; }
.wx-row b { font-size: 17px; color: var(--navy); }
.wx-row b.empty { color: #9DB3BC; }
.sunset-box {
  background: var(--navy); color: #fff; border-radius: 14px; padding: 14px 18px; margin-top: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.sunset-box span { display: flex; gap: 8px; align-items: center; }
.sunset-box b { color: var(--orange); font-size: 20px; }
.disc { font-size: 12px !important; color: var(--sub); margin-top: 6px; }
.alert-line { display: flex; gap: 10px; align-items: center; }

/* 오늘 상태 배지 */
.title-badge { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.day-badge {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 10px;
}
.day-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.day-good  { background: #DDF3EA; color: #1E7A57; }
.day-mild  { background: #FFF1CC; color: #946200; }
.day-rough { background: #FDE2CF; color: #B2531A; }
.day-stop  { background: #FBE0E0; color: #B42B2B; }
.day-none  { background: #EEF4F6; color: #7E9AA4; }

/* 수치 + 쉬운 말 */
.wx-val { display: flex; align-items: center; gap: 8px; }
.easy {
  font-style: normal; font-size: 12px; font-weight: 500;
  background: var(--chip-bg); color: var(--chip-text); border-radius: 999px; padding: 2px 8px;
}

/* 휴대폰 표지: 날씨 한 줄 요약 (PC에서는 숨김) */
.live-summary { display: none; }
.live-summary {
  background: #fff; border: 1px solid var(--line); border-radius: 16px;
  padding: 14px 16px; box-shadow: 0 12px 28px rgba(11,42,63,.10);
  flex-direction: column; gap: 8px;
}
.ls-top { display: flex; align-items: center; gap: 8px; }
.ls-top > b { font-size: 15px; }
.ls-more { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--chip-text); white-space: nowrap; }
.ls-line { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--sub); }
.ls-line b { color: var(--navy); }
.ls-line em { font-style: normal; color: var(--chip-text); }

/* 이번 주 날씨 */
.week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.week-card {
  background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px;
  display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
}
.week-card.today { border: 2px solid var(--orange); }
.wk-day { display: flex; align-items: baseline; gap: 6px; }
.wk-day span { font-size: 12px; color: var(--sub); }
.wk-sky { font-size: 14px; color: var(--sub); }
.wk-temp { font-size: 14px; color: var(--sub); }
.wk-temp b { font-size: 18px; color: var(--navy); }
.wk-info { list-style: none; font-size: 13px; color: var(--sub); display: flex; flex-direction: column; gap: 2px; }
.wk-info li { display: flex; align-items: center; gap: 5px; }

/* 한 달 날씨 (달력) */
.cal {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
}
.cal-head { text-align: center; font-size: 12px; font-weight: 700; color: var(--sub); padding: 4px 0; }
.cal-head.sun, .cal-date.sun { color: #C0504D; }
.cal-head.sat, .cal-date.sat { color: #2F6FB0; }
.cal-cell {
  min-height: 74px; border-radius: 10px; background: var(--bg); padding: 6px 8px;
  display: flex; flex-direction: column; gap: 2px; font-size: 12px;
}
.cal-cell.blank { background: transparent; }
.cal-cell.today { outline: 2px solid var(--orange); outline-offset: -2px; }
.cal-date { font-weight: 700; font-size: 13px; color: var(--navy); }
.cal-st { color: #9DB3BC; font-weight: 500; }
.cal-temp { color: #7E9AA4; }
.cal-cell.st-good  .cal-st { color: #1E7A57; }
.cal-cell.st-mild  .cal-st { color: #946200; }
.cal-cell.st-rough .cal-st { color: #B2531A; }
.cal-cell.st-stop  .cal-st { color: #B42B2B; }

/* 쉬운 말 기준표 */
.legend ul { list-style: none; }
.legend-days { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.legend-days li { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 14px; color: var(--sub); }
.legend-scale { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid #EEF4F6; font-size: 13px; }
.legend-scale:last-child { border-bottom: 0; }
.legend-scale > span { font-weight: 700; color: var(--navy); }
.legend-scale ul { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--sub); }
.legend-scale b { color: var(--chip-text); font-weight: 700; margin-right: 2px; }

/* 시설 카드 */
.facility-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.fee-tag {
  flex-shrink: 0; font-size: 12px; font-weight: 700;
  background: var(--chip-bg); color: var(--chip-text);
  border-radius: 999px; padding: 3px 10px; margin-top: 2px;
}
.facility-card .info-list { margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--line); }

/* 가는 방법 카드 */
.notice-line {
  background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--orange);
  border-radius: 12px; padding: 12px 16px; margin-bottom: 20px;
  font-size: 14px; color: var(--sub);
}
.transport-card { gap: 10px; }
.mode-title { display: flex; align-items: center; gap: 6px; font-weight: 700; margin-top: 6px; }
.mode-title .muted { font-weight: 500; font-size: 14px; }
.bus-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.bus-table th {
  text-align: left; font-size: 12px; font-weight: 500; color: var(--sub);
  padding: 4px 6px; border-bottom: 1px solid var(--line);
}

}

/* ----- 날씨 쉬운 말 도우미 ----- */
const toNum = v => (v === "" || v == null || isNaN(Number(v))) ? NaN : Number(v);
function easyText(kind, value) {
  const list = (D.easy || {})[kind];
  const v = toNum(value);
  if (!list || isNaN(v)) return "";
  const hit = list.find(l => l.under === undefined || v < l.under);
  return hit ? hit.text : "";
}
// 바람·파고·특보로 그날 상태 고르기 (값이 하나도 없으면 null)
function dayStatus(wind, wave, alert) {
  const w = toNum(wind), h = toNum(wave);
  const a = String(alert || "");
  const storm = /풍랑/.test(a);
  if (isNaN(w) && isNaN(h) && !storm) return null;
  for (const d of D.easy.day) {
    if (d.key === "good") return d;
    if ((d.key === "stop" && storm) || (!isNaN(w) && w >= d.wind) || (!isNaN(h) && h >= d.wave)) return d;
  }
  return null;
}
function currentValue(id) { const w = (D.live.weather || []).find(x => x.id === id); return w ? w.value : ""; }
function currentStatus() { return dayStatus(currentValue("wind"), currentValue("wave"), currentValue("alert")); }
function dayBadge(st, short = false) {
  return st
    ? `<span class="day-badge day-${st.key}">${esc(short ? st.short : st.text)}</span>`
    : `<span class="day-badge day-none">${short ? "--" : "상태 확인 중"}</span>`;
}

/* ----- 날짜 도우미 ----- */
const WEEKDAY = ["일", "월", "화", "수", "목", "금", "토"];
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function findDay(list, d) { return (list || []).find(x => x.date === dateKey(d)) || {}; }
const show = (v, unit = "") => (toNum(v) === toNum(v)) ? esc(v + unit) : "--";

/* ----- 표지(휴대폰)용 날씨 한 줄 요약 ----- */
function liveSummary() {
  const part = (label, id, unit) => {
    const v = currentValue(id), e = easyText(id, v);
    return `<span>${label} <b>${show(v, unit)}</b>${e ? ` <em>${esc(e)}</em>` : ""}</span>`;
  };
  return `
    <a class="live-summary" href="#/live">
      <div class="ls-top"><b>현재 날씨</b>${dayBadge(currentStatus())}<span class="ls-more">실시간 정보 ›</span></div>
      <div class="ls-line">${part("기온", "temp", "℃")}${part("바람", "wind", "m/s")}${part("파고", "wave", "m")}<span>일몰 <b>${esc(D.live.sunset || "--:--")}</b></span></div>
    </a>`;
}

/* ----- 이번 주 날씨 (오늘부터 7일) ----- */
function weekView() {
  const today = new Date();
  const cards = [0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = addDays(today, i), f = findDay(D.live.week, d);
    const label = i === 0 ? "오늘" : i === 1 ? "내일" : WEEKDAY[d.getDay()] + "요일";
    return `
      <div class="week-card ${i === 0 ? "today" : ""}">
        <div class="wk-day"><b>${label}</b><span>${d.getMonth() + 1}/${d.getDate()}</span></div>
        <div class="wk-sky">${esc(f.sky || "--")}</div>
        <div class="wk-temp"><b>${show(f.tmax, "°")}</b> / ${show(f.tmin, "°")}</div>
        <ul class="wk-info">
          <li>${icon("wind", 14)} ${show(f.wind, "m/s")}</li>
          <li>${icon("wave", 14)} ${show(f.wave, "m")}</li>
        </ul>
        ${dayBadge(dayStatus(f.wind, f.wave, f.alert), true)}
      </div>`;
  }).join("");
  return `<div class="week-row">${cards}</div>`;
}

/* ----- 한 달 날씨 (오늘부터 30일, 달력 모양) ----- */
function monthView() {
  const today = new Date();
  const lead = today.getDay();   // 오늘 앞의 빈칸 (일요일 시작)
  const head = WEEKDAY.map((w, i) => `<div class="cal-head ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</div>`).join("");
  const blanks = Array.from({ length: lead }, () => `<div class="cal-cell blank"></div>`).join("");
  const cells = Array.from({ length: 30 }, (_, i) => {
    const d = addDays(today, i), f = findDay(D.live.month, d);
    const st = dayStatus(f.wind, f.wave, f.alert);
    const label = (i === 0 || d.getDate() === 1) ? `${d.getMonth() + 1}/${d.getDate()}` : d.getDate();
    return `
      <div class="cal-cell ${i === 0 ? "today" : ""} ${st ? "st-" + st.key : ""}">
        <span class="cal-date ${d.getDay() === 0 ? "sun" : d.getDay() === 6 ? "sat" : ""}">${label}</span>
        <span class="cal-st">${st ? esc(st.short) : "--"}</span>
        <span class="cal-temp">${show(f.tmax, "°")}/${show(f.tmin, "°")}</span>
      </div>`;
  }).join("");
  return `<div class="cal">${head}${blanks}${cells}</div>`;
}

/* ----- 쉬운 말 기준표 (수치와 함께) ----- */
function easyLegend() {
  const range = (list, unit) => list.map((l, i) => {
    const from = i === 0 ? null : list[i - 1].under;
    const txt = l.under === undefined ? `${from}${unit} 이상` : from == null ? `${l.under}${unit} 미만` : `${from}~${l.under}${unit}`;
    return `<li><b>${esc(l.text)}</b> ${esc(txt)}</li>`;
  }).join("");
  const days = D.easy.day.map(d => `<li>${dayBadge(d)} <span>${esc(d.rule)}</span></li>`).join("");
  return `
    <div class="grid-2 legend">
      <div class="card"><h3>오늘 상태 배지</h3><ul class="legend-days">${days}</ul></div>

}

/* =====================================================================
   주소(#/...)에 따라 페이지 바꾸기
   ===================================================================== */
function router() {
  try { routerInner(); } catch (err) {
    console.error(err);
    document.getElementById("app").innerHTML = pageNotFound();
  }
}
function routerInner() {
  const hash = location.hash || "#/";
  const [pathPart, queryPart] = hash.slice(1).split("?");
  const parts = pathPart.split("/").filter(Boolean);   // 예: ["category", "pet"]
  const params = new URLSearchParams(queryPart || "");

  let html;
  switch (parts[0]) {
    case undefined:   html = pageHome(); break;
    case "result":    html = pageResult(params); break;
    case "ai":        html = pageAI(); break;
    case "category":  html = pageCategory(parts[1]); break;
    case "marina":    html = pageMarina(); break;
    case "yacht":     html = pageYacht(); break;
    case "booking":   html = pageBooking(); break;
    case "transport": html = pageTransport(); break;
    case "tour":      html = pageTour(); break;
    case "safety":    html = pageSafety(parts[1]); break;
    case "live":      html = pageLive(); break;
    default:          html = pageNotFound();
  }
  document.getElementById("app").innerHTML = html;

  // 현재 메뉴 표시
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.classList.toggle("current", hash.startsWith(a.dataset.nav)));
  document.querySelector(".nav")?.classList.remove("open");

  // 안전 가이드 특정 항목으로 왔으면 그 위치로, 아니면 맨 위로
  const focus = parts[0] === "safety" && parts[1] && document.getElementById("safety-" + parts[1]);
  if (focus) focus.scrollIntoView({ behavior: "smooth", block: "center" });
  else window.scrollTo(0, 0);
}

/* ---------- 클릭·입력 처리 ---------- */
document.addEventListener("submit", e => {
  const form = e.target.closest("[data-ai-form]");
  if (!form) return;
  e.preventDefault();
  const text = form.q.value.trim() || form.q.placeholder;
  location.hash = "#/result?q=" + encodeURIComponent(text);
});

document.addEventListener("click", e => {
  // 예시 문장 누르면 입력창에 채우기
  const ex = e.target.closest("[data-example]");
  if (ex) {
    const box = document.getElementById("ai-input");
    box.value = ex.dataset.example;
    box.focus();
    return;
  }
  // CCTV 탭 바꾸기
  const tab = e.target.closest(".cam-tab");
  if (tab) {
    const card = tab.closest(".live-cctv");
    card.querySelectorAll(".cam-tab").forEach(t => {
      const on = t === tab;
      t.classList.toggle("on", on);
      t.setAttribute("aria-selected", on);
    });
    card.querySelector(".cam-view").innerHTML = cameraView(D.live.cameras[Number(tab.dataset.cam)]);
    return;
  }
  // 카테고리 항목 고르기 (여러 개 선택 가능)
  const opt = e.target.closest(".option");
  if (opt) {
    const on = opt.getAttribute("aria-pressed") !== "true";
    opt.setAttribute("aria-pressed", on);
    opt.classList.toggle("active", on);
    const selected = [...document.querySelectorAll(".option.active")].map(b => b.dataset.option);
    document.getElementById("category-result").innerHTML = renderExperiences(selected);
  }
});

window.addEventListener("hashchange", router);
renderHeader();
renderFooter();
router();

  </script>
</body>
</html>
