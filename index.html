<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요트핏 | 강릉 마리나 가이드</title>
  <meta name="description" content="강릉 마리나의 체험, 가는 방법, 주변 관광, 안전 수칙을 한곳에서 확인하고 AI로 방문 코스를 추천받으세요.">

  <!-- 글꼴: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

<body>
  <!-- 상단 메뉴 (app.js가 채워 넣습니다) -->
  <header id="site-header"></header>

  <!-- 페이지 본문 (메뉴를 누르면 app.js가 내용을 바꿉니다) -->

  <!-- 하단 (app.js가 채워 넣습니다) -->
  <footer id="site-footer"></footer>

  <!-- 순서 중요: 정보 파일(data.js) 먼저, 그다음 동작 파일(app.js) -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
